<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIK RAPA'I — Klinik Konsultasi Perencanaan BAPPEDA Kabupaten Pidie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#082B68; --blue:#0D5BD7; --lightblue:#EAF4FF; --white:#FFFFFF;
  --red:#E31B23; --yellow:#F5B800; --green:#0F9D58; --purple:#6D3BBF;
  --gray:#64748b; --border:#e3e9f2; --bg:#f4f7fc; --text:#16233b;
  --radius:14px; --shadow:0 4px 18px rgba(8,43,104,.08);
  --shadow-lg:0 14px 40px rgba(8,43,104,.16);
}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3d0e2;border-radius:8px}
.container{max-width:1200px;margin:0 auto;padding:0 18px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.txt-c{text-align:center}.txt-r{text-align:right}
.muted{color:var(--gray)}.small{font-size:12.5px}.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.18s;white-space:nowrap;border:1.5px solid transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0a4bb5;box-shadow:0 6px 16px rgba(13,91,215,.3)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:#061f4d}
.btn-yellow{background:var(--yellow);color:#3a2b00}.btn-yellow:hover{background:#e0a800}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#c0151c}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#0c8148}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#5a2fa0}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:#f5f8fd;border-color:#c9d7ea}
.btn-outline{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.14)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px;background:#f1f5fb;color:var(--navy)}
.btn-icon:hover{background:#e2ecfa}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.bg-wait{background:#FFF4D6;color:#8a6100}.bg-accept{background:#E1EEFF;color:#0b4bb0}
.bg-process{background:#EFE6FF;color:#5b28a8}.bg-done{background:#DDF6E8;color:#0a7a44}
.bg-reject{background:#FFE2E3;color:#b3121a}.bg-cancel{background:#ECEFF4;color:#5a6678}
.bg-offline{background:#EAF4FF;color:#0b4bb0}.bg-online{background:#E6F7F1;color:#0a7a44}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:9px}
.card-h h3 i{color:var(--blue)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#33425c;margin-bottom:6px}
.field label .req{color:var(--red)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:#fbfcfe;transition:.15s;color:var(--text)}
.input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(13,91,215,.1)}
.input[readonly]{background:#f1f5fb;cursor:not-allowed}
textarea.input{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pw-wrap{position:relative}.pw-wrap .toggle-pw{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gray);padding:6px}
.file-drop{border:2px dashed #c9d7ea;border-radius:12px;padding:20px;text-align:center;background:#fbfdff;cursor:pointer;transition:.15s}
.file-drop:hover{border-color:var(--blue);background:var(--lightblue)}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;min-width:640px;background:#fff}
table.tbl th{background:#f6f9fe;color:var(--navy);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:13px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid #f0f4fa;font-size:13.5px;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#f9fbff}
.pub-header{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);box-shadow:0 2px 14px rgba(8,43,104,.06)}
.pub-inner{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand svg{width:50px;height:50px}
.brand .bt{line-height:1.15}
.brand .bt strong{display:block;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.3px}
.brand .bt span{font-size:11px;color:var(--gray);font-weight:600}
.pub-nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.pub-nav::-webkit-scrollbar{display:none}
.pub-nav a{padding:8px 11px;border-radius:8px;font-size:12.8px;font-weight:600;color:#3a4a63;white-space:nowrap;transition:.15s}
.pub-nav a:hover{background:var(--lightblue);color:var(--blue)}
.pub-nav a.active{background:var(--navy);color:#fff}
.pub-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hamburger{display:none;width:40px;height:40px;border-radius:10px;background:#f1f5fb;color:var(--navy);font-size:17px}
.hero{background:linear-gradient(135deg,#082B68 0%,#0D5BD7 60%,#1a72e8 100%);color:#fff;padding:62px 0 74px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-120px;top:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,0,.28),transparent 65%)}
.hero::before{content:'';position:absolute;left:-140px;bottom:-190px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.35fr .85fr;gap:44px;align-items:center}
.hero h1{font-size:36px;font-weight:800;line-height:1.2;margin-bottom:14px;letter-spacing:-.5px}
.hero p{font-size:15.5px;opacity:.94;max-width:640px;margin-bottom:24px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 15px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:18px}
.hero-card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);border-radius:20px;padding:26px;backdrop-filter:blur(8px);text-align:center}
.hero-card svg{width:110px;height:110px;margin:0 auto 14px}
.hero-card h3{font-size:17px;font-weight:800;margin-bottom:6px}
.hero-card p{font-size:12.8px;opacity:.9;margin:0}
.section{padding:56px 0}.section-alt{background:#fff}
.sec-head{text-align:center;max-width:760px;margin:0 auto 38px}
.sec-head .kicker{display:inline-block;background:var(--lightblue);color:var(--blue);font-weight:800;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;padding:6px 15px;border-radius:999px;margin-bottom:12px}
.sec-head h2{font-size:27px;font-weight:800;color:var(--navy);margin-bottom:10px;letter-spacing:-.4px}
.sec-head p{color:var(--gray);font-size:14.5px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.feature{background:#fff;border-radius:var(--radius);padding:24px;border:1px solid var(--border);box-shadow:var(--shadow);transition:.2s}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.feature .ico{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:15px;background:var(--lightblue);color:var(--blue)}
.feature .ico.y{background:#FFF4D6;color:#a97c00}
.feature .ico.r{background:#FFE2E3;color:var(--red)}
.feature .ico.g{background:#DDF6E8;color:var(--green)}
.feature .ico.p{background:#EFE6FF;color:var(--purple)}
.feature h4{font-size:15.5px;font-weight:800;color:var(--navy);margin-bottom:7px}
.feature p{font-size:13.5px;color:#5c6b82}
.list-item{display:flex;gap:15px;align-items:flex-start;padding:15px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:11px;transition:.18s}
.list-item:hover{border-color:#bdd3f0;box-shadow:var(--shadow)}
.list-item .li-ico{width:44px;height:44px;border-radius:11px;background:var(--lightblue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.list-item h4{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:3px}
.list-item .meta{font-size:12px;color:var(--gray);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:5px}
.list-item p{font-size:13px;color:#5c6b82}
.news-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.news-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.news-thumb{height:158px;background:linear-gradient(135deg,#0D5BD7,#082B68);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);font-size:40px}
.news-body{padding:18px}
.news-body h4{font-size:15px;font-weight:800;color:var(--navy);margin:8px 0 8px;line-height:1.4}
.news-body p{font-size:13px;color:#5c6b82;margin-bottom:12px}
.testi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.testi .quote{font-size:14px;color:#41506a;font-style:italic;margin:14px 0 16px}
.testi .who{display:flex;align-items:center;gap:11px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--yellow);font-size:13px}
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#082B68,#0D5BD7)}
.login-left{display:flex;flex-direction:column;justify-content:center;padding:60px;color:#fff;position:relative;overflow:hidden}
.login-left::after{content:'';position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,0,.3),transparent 68%)}
.login-left svg{width:120px;height:120px;margin-bottom:20px}
.login-left h1{font-size:28px;font-weight:800;line-height:1.25;margin-bottom:12px;position:relative;z-index:2}
.login-left p{font-size:14.5px;opacity:.9;max-width:460px;position:relative;z-index:2}
.login-feats{margin-top:30px;display:flex;flex-direction:column;gap:13px;position:relative;z-index:2}
.login-feats div{display:flex;align-items:center;gap:11px;font-size:13.5px}
.login-feats i{color:var(--yellow)}
.login-right{background:#fff;display:flex;align-items:center;justify-content:center;padding:40px 26px}
.login-box{width:100%;max-width:400px}
.login-box .lg-head{text-align:center;margin-bottom:26px}
.login-box .lg-head svg{width:80px;height:80px;margin:0 auto 12px}
.login-box .lg-head h2{font-size:18px;font-weight:800;color:var(--navy);line-height:1.3}
.login-box .lg-head p{font-size:12.5px;color:var(--gray);margin-top:5px}
.demo-box{background:#f6f9fe;border:1px dashed #c4d6ee;border-radius:11px;padding:13px;margin-top:18px;font-size:11.8px;color:#4a5b75;line-height:1.7}
.demo-box b{color:var(--navy)}
.demo-box code{background:#e7effb;padding:1px 6px;border-radius:5px;color:#0b4bb0;font-weight:700}
.dash{display:flex;min-height:100vh}
.sidebar{width:262px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;transition:width .25s,transform .25s;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:250}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0}
.sb-brand svg{width:44px;height:44px;flex-shrink:0}
.sb-brand .t{line-height:1.15;overflow:hidden;white-space:nowrap}
.sb-brand .t strong{display:block;font-size:13.5px;font-weight:800}
.sb-brand .t span{font-size:10.5px;opacity:.72}
.sb-menu{padding:12px 10px;flex:1}
.sb-group{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;opacity:.5;padding:14px 12px 7px}
.sb-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-size:13.2px;font-weight:600;color:rgba(255,255,255,.82);transition:.15s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.sb-link i{width:19px;text-align:center;font-size:14.5px;flex-shrink:0}
.sb-link:hover{background:rgba(255,255,255,.11);color:#fff}
.sb-link.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(13,91,215,.4)}
.sb-link .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px}
.sb-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.12);flex-shrink:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:120}
.topbar .crumb{font-size:13px;color:var(--gray);font-weight:600}
.topbar .crumb b{color:var(--navy)}
.topbar-spacer{flex:1}
.clock{font-size:12.5px;font-weight:700;color:var(--navy);background:var(--lightblue);padding:7px 13px;border-radius:9px;white-space:nowrap}
.clock small{display:block;font-size:10.5px;font-weight:600;color:var(--blue)}
.tb-user{display:flex;align-items:center;gap:10px;padding:5px 11px 5px 5px;border-radius:999px;background:#f4f8fe;cursor:pointer}
.tb-user .avatar{width:33px;height:33px;font-size:12.5px}
.tb-user .nm{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.15}
.tb-user .rl{font-size:10.5px;color:var(--gray);font-weight:600}
.bell{position:relative;width:40px;height:40px;border-radius:11px;background:#f1f5fb;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px}
.bell .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.content{padding:22px;flex:1;min-width:0}
.notif-dd{position:absolute;top:56px;right:16px;width:370px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--border);z-index:400;overflow:hidden}
.notif-dd .nh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.notif-dd .nh h4{font-size:14px;font-weight:800;color:var(--navy)}
.notif-list{max-height:370px;overflow-y:auto}
.notif-item{padding:13px 16px;border-bottom:1px solid #f2f6fb;display:flex;gap:11px;cursor:pointer;transition:.15s}
.notif-item:hover{background:#f8fbff}
.notif-item.unread{background:#f0f7ff}
.notif-item .ni-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--lightblue);color:var(--blue)}
.notif-item h5{font-size:12.8px;font-weight:700;color:var(--navy);margin-bottom:2px}
.notif-item p{font-size:12px;color:#5c6b82;line-height:1.45}
.notif-item .tm{font-size:10.5px;color:#9aa8bd;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
.stat{background:#fff;border-radius:13px;padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:11px}
.stat .sv{font-size:24px;font-weight:800;color:var(--navy);line-height:1.1}
.stat .sl{font-size:11.5px;color:var(--gray);font-weight:700;margin-top:3px}
.si.blue{background:#E1EEFF;color:#0b4bb0}.si.yellow{background:#FFF4D6;color:#a97c00}
.si.green{background:#DDF6E8;color:#0a7a44}.si.red{background:#FFE2E3;color:#b3121a}
.si.purple{background:#EFE6FF;color:#5b28a8}.si.navy{background:#E4EAF6;color:var(--navy)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .input{max-width:230px}
.toolbar select.input{max-width:200px}
.empty{text-align:center;padding:52px 20px;color:var(--gray)}
.empty i{font-size:44px;color:#c8d6e8;margin-bottom:14px;display:block}
.empty h4{font-size:15px;color:var(--navy);margin-bottom:6px;font-weight:700}
.empty p{font-size:13px}
.modal-root{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:18px}
.modal-root.active{display:flex}
.modal-overlay{position:absolute;inset:0;background:rgba(8,25,55,.55);backdrop-filter:blur(3px)}
.modal{position:relative;background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.lg{max-width:820px}.modal.xl{max-width:1080px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15.5px;font-weight:800;color:var(--navy)}
.modal-head button{width:32px;height:32px;border-radius:8px;background:#f1f5fb;color:var(--gray)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#toasts{position:fixed;top:18px;right:18px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:#fff;border-radius:12px;padding:13px 16px;box-shadow:var(--shadow-lg);border-left:4px solid var(--blue);display:flex;gap:11px;align-items:flex-start;animation:slideIn .25s;font-size:13.2px}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--yellow)}

const NOTIF_ICON = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
  '<rect width="64" height="64" rx="14" fill="#082B68"/>' +
  '<rect x="14" y="18" width="36" height="28" rx="4" fill="#fff"/>' +

/* ==================== UTIL ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const uid = (p = 'id') => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function slugInstansi(s) {
  return String(s || '').toUpperCase()
    .replace(/[().,'"\/\\\-]/g, ' ')
    .replace(/[^A-Z0-9 ]/g, '')
    .replace(/\s+/g, '_')
    .replace(/^_+|_+$/g, '');
}
function tglID(d) { if (!d) return '-'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }); }
function tglShort(d) { if (!d) return '-'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
function waktuID(d) { const dt = new Date(d); return dt.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function hariID(d) { if (!d) return '-'; const dt = new Date(d); if (isNaN(dt)) return '-'; return ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][dt.getDay()]; }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function initials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function bytes(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
function relTime(d) { const diff = (Date.now() - new Date(d).getTime()) / 1000; if (diff < 60) return 'Baru saja'; if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu'; if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu'; if (diff < 604800) return Math.floor(diff / 86400) + ' hari lalu'; return tglShort(d); }
function daysBetween(a, b) { return Math.ceil((new Date(a) - new Date(b)) / 86400000); }

/* ==================== TOAST ==================== */
function toast(msg, type = 'success', title = null) {
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warn: 'fa-triangle-exclamation', info: 'fa-circle-info' };
  const titles = { success: 'Berhasil', error: 'Gagal', warn: 'Perhatian', info: 'Informasi' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><div><strong>${esc(title || titles[type])}</strong><span>${esc(msg)}</span></div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = '.25s'; el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; setTimeout(() => el.remove(), 260); }, 3600);
}

/* ==================== MODAL ==================== */
function openModal(title, body, footer = '', size = '') {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"></div>
    <div class="modal ${size}"><div class="modal-head"><h3>${title}</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
  root.classList.add('active');
  if (typeof tickCountdowns === 'function') tickCountdowns();
}
function closeModal() { const r = $('#modal-root'); r.classList.remove('active'); r.innerHTML = ''; }
function confirmAction(msg, cb, okLabel = 'Ya, Lanjutkan', danger = true) {
  openModal('Konfirmasi', `<div style="display:flex;gap:14px;align-items:flex-start">
    <div style="width:44px;height:44px;border-radius:12px;background:#FFE2E3;color:#E31B23;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">
      <i class="fa-solid fa-triangle-exclamation"></i></div>
    <p style="font-size:14px;color:#41506a">${msg}</p></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cfmOk">${okLabel}</button>`);
  $('#cfmOk').onclick = () => { closeModal(); cb(); };
}

/* ============================================================
   BACKGROUND NOTIFICATION MANAGER (FIXED)
   - Service Worker inline untuk notifikasi sistem
   - Notification API untuk izin & fallback
   - Polling localStorage untuk mendeteksi notifikasi baru
   - Banner dengan snooze + close, tidak looping
   ============================================================ */
const SW_CODE = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
self.addEventListener('notificationclick', e => {
  e.notification.close();
  const target = (e.notification.data && e.notification.data.url) || './';
  e.waitUntil(
    self.clients.matchAll({ type:'window', includeUncontrolled:true }).then(cls => {
      for (const c of cls) { if ('focus' in c) { c.focus(); if (target && 'navigate' in c) c.navigate(target).catch(()=>{}); return; } }
      if (self.clients.openWindow) return self.clients.openWindow(target);
    })
  );
});
self.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'SHOW_NOTIFICATION') {
    self.registration.showNotification(d.title || 'KLIK RAPA\\'I', {
      body: d.body || '',
      icon: d.icon || undefined,
      badge: d.icon || undefined,
      tag: d.tag || 'klikrapai',
      renotify: true,
      vibrate: [120, 60, 120],
      data: { url: d.url || './' }
    });
  }
});
`;
let _swReg = null;
let _bannerTimer = null;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  if (_swReg) return _swReg;
  try {
    const blob = new Blob([SW_CODE], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    _swReg = await navigator.serviceWorker.register(url, { scope: './' });
    if (_swReg.installing) {
      _swReg.installing.addEventListener('statechange', function () {
        if (this.state === 'activated') console.log('[SW] aktif');
      });
    }
    return _swReg;
  } catch (e) { console.warn('[SW] gagal:', e); return null; }
}
function notifPermissionState() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;
}
function notifSupported() { return 'Notification' in window; }
function notifEnabled() {
  return localStorage.getItem(NOTIF_PREF_KEY) === '1' && notifPermissionState() === 'granted';
}
async function requestNotifPermission(silent = false) {
  if (!notifSupported()) { if (!silent) toast('Browser tidak mendukung notifikasi.', 'warn'); return false; }
  if (Notification.permission === 'granted') {
    localStorage.setItem(NOTIF_PREF_KEY, '1');
    if (!_swReg) await registerServiceWorker();
    return true;
  }
  if (Notification.permission === 'denied') {
    if (!silent) toast('Izin notifikasi diblokir. Aktifkan melalui pengaturan browser.', 'warn');
    return false;
  }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') {
      localStorage.setItem(NOTIF_PREF_KEY, '1');
      await registerServiceWorker();
      if (!silent) {
        showBrowserNotification('Notifikasi Aktif', 'Anda akan menerima notifikasi KLIK RAPA\'I walau aplikasi tidak dibuka.', '');
        toast('Notifikasi browser diaktifkan.', 'success');
      }
      return true;
    }
    /* p === 'default' (user close prompt) atau 'denied' */
    if (!silent) toast('Izin notifikasi belum diberikan.', 'warn');
    return false;
  } catch (e) { console.warn(e); return false; }
}
function disableNotif() {
  localStorage.removeItem(NOTIF_PREF_KEY);
  toast('Notifikasi browser dimatikan.', 'info');
}
async function toggleNotifPermission() {
  if (notifEnabled()) { disableNotif(); render(); return; }
  const ok = await requestNotifPermission(false);
  if (ok) render();
}
/* === FIX: dedup & cap agar tidak tumbuh tanpa batas === */
const _shownNotifIds = new Set();
function _rememberShown(id) {
  _shownNotifIds.add(id);
  if (_shownNotifIds.size > 500) {
    const arr = Array.from(_shownNotifIds);
    _shownNotifIds.clear();
    arr.slice(-200).forEach(x => _shownNotifIds.add(x));
  }
}
async function showBrowserNotification(title, body, url, id) {
  if (!notifEnabled()) return;
  if (id && _shownNotifIds.has(id)) return;
  if (id) _rememberShown(id);
  const tag = id ? 'klikrapai-' + id : 'klikrapai-' + Date.now();
  try {
    if (_swReg && _swReg.active) {
      _swReg.active.postMessage({ type: 'SHOW_NOTIFICATION', title, body, url, icon: NOTIF_ICON, tag });
    } else if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'SHOW_NOTIFICATION', title, body, url, icon: NOTIF_ICON, tag });
    } else if (notifSupported() && Notification.permission === 'granted') {
      new Notification(title, { body, icon: NOTIF_ICON, tag });
    }
  } catch (e) { console.warn('[notif] gagal tampil:', e); }
}

/* === FIX: polling dengan reset state & refresh badge === */
let _lastTopNotifId = null;
function resetNotifPollingState() { _lastTopNotifId = null; }
function initNotifPolling() {
  resetNotifPollingState();
  const u = currentUser();
  if (u) {
    const list = myNotifs(u.id);
    _lastTopNotifId = list.length ? list[0].id : null;
  }
  if (window._notifPollTimer) clearInterval(window._notifPollTimer);
  window._notifPollTimer = setInterval(() => {
    const u2 = currentUser();
    if (!u2) return;
    const l = myNotifs(u2.id);
    if (!l.length) return;
    const top = l[0];
    if (_lastTopNotifId === null) { _lastTopNotifId = top.id; return; }
    if (top.id !== _lastTopNotifId) {
      const fresh = [];
      for (const n of l) { if (n.id === _lastTopNotifId) break; if (!n.read) fresh.push(n); }
      _lastTopNotifId = top.id;
      fresh.reverse().forEach(n => showBrowserNotification(n.title, n.message, n.link || '', n.id));
      /* refresh badge bila perlu */
      const dot = document.querySelector('.bell .dot');
      const unread = unreadCount(u2.id);
      if (!dot && unread > 0) render();
    }
  }, 12000);
}

/* === FIX utama: banner tidak looping === */
function removeBanner() {
  const b = $('#notifBanner');
  if (b) b.remove();
}
function isBannerSnoozed() {
  const until = parseInt(localStorage.getItem(NOTIF_BANNER_SNOOZE_KEY) || '0', 10);
  return Date.now() < until;
}
function snoozeBanner(ms) {
  localStorage.setItem(NOTIF_BANNER_SNOOZE_KEY, String(Date.now() + ms));
}
/* Debounce agar tidak menumpuk */
function scheduleBannerCheck(delay = 800) {
  if (_bannerTimer) clearTimeout(_bannerTimer);
  _bannerTimer = setTimeout(() => { _bannerTimer = null; maybeShowNotifBanner(); }, delay);
}
function maybeShowNotifBanner() {
  /* Tidak ada user → sembunyikan */
  if (!currentUser()) { removeBanner(); return; }
  /* Tidak didukung browser */
  if (!notifSupported() || notifPermissionState() === 'unsupported') { removeBanner(); return; }
  /* FIX: jangan tampilkan banner bila izin sudah DITOLAK browser */
  if (notifPermissionState() === 'denied') { removeBanner(); return; }
  /* Sudah aktif */
  if (notifEnabled()) { removeBanner(); return; }
  /* Snooze aktif */
  if (isBannerSnoozed()) { removeBanner(); return; }
  /* Sudah tampil */
  if ($('#notifBanner')) return;
  /* Buat banner */
  const el = document.createElement('div');
  el.className = 'notif-banner no-print';
  el.id = 'notifBanner';
  el.innerHTML = `
    <button class="nb-close" onclick="dismissNotifBanner()" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
    <div class="nb-ico"><i class="fa-solid fa-bell"></i></div>
    <div style="flex:1">
      <h5>Aktifkan Notifikasi Browser</h5>
      <p>Dapatkan pemberitahuan permohonan, penugasan, dan hasil analisis walau aplikasi tidak sedang dibuka.</p>
      <div class="nb-actions">
        <button class="btn btn-yellow btn-sm" onclick="enableNotifFromBanner(this)"><i class="fa-solid fa-bell"></i> Aktifkan</button>
        <button class="btn btn-ghost btn-sm" onclick="dismissNotifBanner()">Nanti</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}
/* FIX: snooze 7 hari saat tombol "Nanti"/X ditekan */
function dismissNotifBanner() {
  snoozeBanner(7 * 24 * 60 * 60 * 1000);
  removeBanner();
}
/* FIX: banner selalu dihilangkan setelah klik Aktifkan, apapun hasilnya */
async function enableNotifFromBanner(btn) {
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...'; }
  /* Hilangkan dulu untuk cegah double-click */
  removeBanner();
  const ok = await requestNotifPermission(false);
  if (ok) {
    render();
  } else {
    /* Gagal / ditolak / ditutup → snooze 1 hari supaya tidak looping */
    snoozeBanner(24 * 60 * 60 * 1000);
  }
}
window.enableNotifFromBanner = enableNotifFromBanner;
window.dismissNotifBanner = dismissNotifBanner;

/* ==================== AUTH ==================== */
function currentUser() {
  const id = localStorage.getItem(SESSION_KEY);
  if (!id) return null;
  return DB.users.find(u => u.id === id && u.active) || null;
}
function setSession(id) { localStorage.setItem(SESSION_KEY, id); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }
function doLogin(username, password) {
  const u = DB.users.find(x => x.username.toLowerCase() === String(username).trim().toLowerCase());
  if (!u) return { ok: false, msg: 'Username tidak ditemukan.' };
  if (!u.active) return { ok: false, msg: 'Akun Anda dinonaktifkan.' };
  if (u.password !== password) return { ok: false, msg: 'Password salah.' };
  setSession(u.id); logAct(u, 'Login', 'Berhasil masuk sistem');
  return { ok: true, user: u };
}
/* FIX: logout membersihkan banner & polling state */
function doLogout() {
  confirmAction('Apakah Anda yakin ingin keluar?', () => {
    const u = currentUser(); if (u) logAct(u, 'Logout', 'Keluar sistem');
    clearSession();
    removeBanner();
    resetNotifPollingState();
    toast('Logout berhasil.', 'success');
    location.hash = '#/login'; render();
  }, 'Ya, Logout');
}

/* ==================== LOG ==================== */
function logAct(user, aksi, detail) {
  DB.logs.unshift({ id: uid('log'), userId: user ? user.id : 'system', nama: user ? user.nama : 'Sistem',
    role: user ? user.role : '-', aksi, detail, waktu: new Date().toISOString() });
  if (DB.logs.length > 1500) DB.logs.length = 1500;
  saveDB();
}

/* ==================== NOTIF ==================== */
function notify(userId, title, message, type = 'info', link = '') {
  const notif = { id: uid('ntf'), userId, title, message, type, link, read: false, createdAt: new Date().toISOString() };
  DB.notifications.unshift(notif);
  if (DB.notifications.length > 800) DB.notifications.length = 800;
  saveDB();
  const cur = currentUser();
  if (cur && cur.id === userId && notifEnabled()) {
    showBrowserNotification(title, message, link || '', notif.id);
  }
}
function notifyRole(role, title, message, type = 'info', link = '') {
  DB.users.filter(u => u.role === role && u.active).forEach(u => notify(u.id, title, message, type, link));
}
function myNotifs(userId) { return DB.notifications.filter(n => n.userId === userId); }
function unreadCount(userId) { return myNotifs(userId).filter(n => !n.read).length; }

function statusClass(s) {

    'Selesai': 'bg-done', 'Ditolak': 'bg-reject', 'Dibatalkan': 'bg-cancel' }[s] || 'bg-cancel';
}
function badge(s) { return `<span class="badge ${statusClass(s)}">${esc(s)}</span>`; }

/* ==================== NOMOR ==================== */
function genNomor(jenis) {
  const d = new Date();
  const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const prefix = jenis === 'offline' ? 'OF' : 'ON';
  const count = DB.serviceRequests.filter(r => r.nomor.includes(`-${prefix}-${ymd}-`)).length + 1;
  return `KLIK-${prefix}-${ymd}-${pad(count, 4)}`;
}

/* ==================== FILE ==================== */
function readFileAsBase64(file, cb) {
  const reader = new FileReader();
  reader.onload = e => cb({ name: file.name, size: file.size, type: file.type, data: e.target.result });
  reader.readAsDataURL(file);
}
function validatePDF(file) {
  if (!file) return 'File wajib dipilih.';
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf) return 'File harus PDF.';
  if (file.size > APP.maxFileSize) return `Maksimal ${bytes(APP.maxFileSize)}.`;
  return null;
}
function downloadFile(fileRec) {
  if (!fileRec || !fileRec.data) return toast('File tidak tersedia.', 'error');
  const a = document.createElement('a'); a.href = fileRec.data; a.download = fileRec.name; a.click();
}

/* ==================== ROUTER ==================== */
const PUBLIC_PAGES = ['home', 'profil-perencana', 'tugas-fungsi', 'klinik', 'regulasi', 'dokumen', 'pengumuman', 'berita', 'testimonial', 'login'];
function getRoute() { const h = location.hash.replace(/^#\/?/, '') || 'home'; return h.split('/')[0] || 'home'; }
function go(p) { location.hash = '#/' + p; }
window.addEventListener('hashchange', () => { closeModal(); render(); });

/* ==================== RENDER ==================== */
function render() {
  const page = getRoute();
  const user = currentUser();
  if (page === 'login') {
    if (user) { go('dashboard'); return; }
    removeBanner();
    $('#app').innerHTML = viewLogin(); return;
  }
  if (PUBLIC_PAGES.includes(page)) {
    if (!user) removeBanner();
    $('#app').innerHTML = viewPublic(page); window.scrollTo(0, 0); return;
  }
  if (!user) {
    toast('Silakan login terlebih dahulu.', 'warn', 'Akses Ditolak');
    location.hash = '#/login'; $('#app').innerHTML = viewLogin(); return;
  }
  $('#app').innerHTML = viewDashboard(user, page);
  window.scrollTo(0, 0);
  if (user.role === 'admin' && page === 'dashboard') setTimeout(initChartsAdmin, 60);
  if (user.role === 'pic' && page === 'dashboard') setTimeout(initCharts, 60);
  if (user.role === 'pic' && page === 'monitoring') setTimeout(initChartsMonitoring, 60);
  if (page === 'notifikasi') markAllRead(user.id);
  tickCountdowns();
  /* FIX: pakai debounce agar tidak menumpuk */
  scheduleBannerCheck(900);
}

function togglePw(id, btn) {
  const el = document.getElementById(id);
  const show = el.type === 'password'; el.type = show ? 'text' : 'password';
  btn.innerHTML = `<i class="fa-solid ${show ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
}
function submitLogin() {
  const res = doLogin($('#loginUser').value, $('#loginPass').value);
  if (!res.ok) { const e = $('#loginErr'); e.textContent = res.msg; e.classList.remove('hidden'); toast(res.msg, 'error', 'Login Gagal'); return; }
  $('#loginErr').classList.add('hidden');
  toast('Selamat datang, ' + res.user.nama + '!', 'success');
  /* FIX: reset polling state setiap login */
  resetNotifPollingState();
  initNotifPolling();
  go('dashboard'); render();
}

function viewDashboard(user, page) {
  const menu = MENUS[user.role] || MENUS.layanan;
  const notifs = myNotifs(user.id);
  const unread = notifs.filter(n => !n.read).length;
  const badges = {
    tugasBaru: DB.assignments.filter(a => a.executorId === user.id && a.status === 'Menunggu Respon').length,
    pengajuanBaru: DB.serviceRequests.filter(r => r.status === 'Menunggu Verifikasi').length,
    ikmBaru: DB.feedbacks.filter(f => !f.verified).length
  };
  const menuHTML = menu.map(m => {
    if (m.g) return `<div class="sb-group">${m.g}</div>`;
    const n = m.badge ? badges[m.badge] : 0;
    return `<a href="#/${m.p}" class="sb-link ${page === m.p ? 'active' : ''}">
      <i class="fa-solid ${m.i}"></i><span>${m.t}</span>${n > 0 ? `<span class="cnt">${n}</span>` : ''}</a>`;
  }).join('');

  let content = '';
  if (user.role === 'admin') content = pageAdmin(page, user);
  else if (user.role === 'pic') content = pagePIC(page, user);
  else if (user.role === 'pelaksana') content = pagePelaksana(page, user);
  else content = pageLayanan(page, user);

  return `<div class="dash" id="dashRoot">
    <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">${LOGO_SVG}<div class="t"><strong>KLIK RAPA'I</strong><span>BAPPEDA Pidie v${APP.versi}</span></div></div>
      <nav class="sb-menu">${menuHTML}</nav>
      <div class="sb-foot"><a class="sb-link" href="javascript:void(0)" onclick="doLogout()">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="crumb">${crumbHTML(user, page)}</div>
        <div class="topbar-spacer"></div>
        ${notifToggleHTML()}
        <div class="clock" id="clockBox"></div>
        <div style="position:relative">
          <button class="bell" onclick="toggleNotifDD()"><i class="fa-solid fa-bell"></i>
            ${unread > 0 ? `<span class="dot">${unread > 99 ? '99+' : unread}</span>` : ''}</button>
          <div id="notifDD"></div></div>
        <div class="tb-user" onclick="go('profil');render()">
          <div class="avatar">${initials(user.nama)}</div>
          <div><div class="nm">${esc(user.nama)}</div><div class="rl">${roleLabel(user.role)}</div></div></div>
      </header>
      <div class="content" id="dashContent">${content}</div>
    </div></div>`;
}
function notifToggleHTML() {
  if (!notifSupported()) return '';
  const st = notifPermissionState();
  if (st === 'denied') {
    return `<span class="chip red" title="Notifikasi diblokir. Aktifkan dari pengaturan browser.">
      <i class="fa-solid fa-bell-slash"></i> <span class="notif-toggle-lbl">Notif Diblokir</span></span>`;
  }

function updateKeperluan(jenisId, keperluanId) {
  const jl = document.getElementById(jenisId).value;
  const sel = document.getElementById(keperluanId);
  sel.innerHTML = jl ? keperluanOptions(jl).map(k => `<option>${esc(k)}</option>`).join('')
    : `<option value="">— Pilih Jenis dahulu —</option>`;
}
function updateHari() {
  const t = $('#ofTanggal').value;
  $('#ofHari').value = t ? hariID(t) : '';
  checkSlot();
}
function checkSlot() {
  const t = $('#ofTanggal')?.value, s = $('#ofSesi')?.value, info = $('#ofSlotInfo');
  if (!info) return;
  if (!t || !s) { info.innerHTML = `<i class="fa-solid fa-circle-info"></i> Pilih tanggal dan sesi.`; return; }
  const kap = getKapasitas(t, s);
  const terpakai = DB.serviceRequests.filter(r => r.jenis === 'offline' && r.jadwal && r.jadwal.tanggal === t && r.jadwal.sesi === s && ['Menunggu Verifikasi', 'Diterima', 'Diproses'].includes(r.status)).length;
  const sisa = Math.max(0, kap - terpakai);
  info.innerHTML = sisa > 0
    ? `<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Slot tersedia: <b>${sisa}</b> dari ${kap} pada ${hariID(t)}, ${tglID(t)} — ${s}.`
    : `<i class="fa-solid fa-circle-xmark" style="color:var(--red)"></i> Slot penuh. Pilih jadwal lain.`;
}
function getKapasitas(tanggal, sesi) {
  const s = DB.schedules.find(x => x.tanggal === tanggal && x.sesi === sesi && x.active);
  return s ? s.kapasitas : APP.kapasitasSesi;
}
function previewFile(input, targetId) {
  const f = input.files[0], el = document.getElementById(targetId);
  if (!f) { el.textContent = 'Belum ada file dipilih.'; return; }
  el.innerHTML = `<i class="fa-solid fa-file-pdf" style="color:var(--red)"></i> <b>${esc(f.name)}</b> · ${bytes(f.size)}`;
}
function submitOffline() {
  const u = currentUser(); if (!u) return;
  const t = $('#ofTanggal').value, s = $('#ofSesi').value;
  if (!t || !s) return toast('Tanggal dan sesi wajib dipilih.', 'error');
  const kap = getKapasitas(t, s);
  const terpakai = DB.serviceRequests.filter(r => r.jenis === 'offline' && r.jadwal && r.jadwal.tanggal === t && r.jadwal.sesi === s && ['Menunggu Verifikasi', 'Diterima', 'Diproses'].includes(r.status)).length;
  if (terpakai >= kap) return toast('Slot penuh.', 'error');

  const nomor = genNomor('offline');
  const req = {
    id: uid('req'), nomor, userId: u.id, jenis: 'offline',
    jenisLayanan: $('#ofJenisLayanan').value, keperluan: $('#ofKeperluan').value,
    deskripsi: $('#ofDeskripsi').value,
    pemohon: { nama: $('#ofNama').value, nip: $('#ofNip').value, instansi: u.instansi,
      jabatan: $('#ofJabatan').value, hp: $('#ofHp').value, email: $('#ofEmail').value },
    jadwal: { tanggal: t, hari: hariID(t), sesi: s },
    file: null, hasilFile: null,
    status: 'Menunggu Verifikasi', catatanPic: '', alasanTolak: '',
    createdAt: new Date().toISOString(),
    riwayat: [{ status: 'Menunggu Verifikasi', waktu: new Date().toISOString(), oleh: u.nama, ket: 'Permohonan dikirim (offline, tanpa dokumen)' }]
  };
  DB.serviceRequests.unshift(req);
  notifyRole('pic', 'Permohonan Baru', `${nomor} — ${req.keperluan} (${req.pemohon.instansi})`, 'info');
  logAct(u, 'Ajukan Permohonan Offline', nomor);
  saveDB();
  toast('Permohonan berhasil dikirim.', 'success');
  openModal('Permohonan Terkirim', `<div style="text-align:center;padding:10px 0">
    <div style="width:66px;height:66px;border-radius:50%;background:#DDF6E8;color:#0a7a44;display:flex;align-items:center;justify-content:center;font-size:29px;margin:0 auto 16px"><i class="fa-solid fa-check"></i></div>

    <p class="muted small mt16">Status: <b>Menunggu Verifikasi Operator</b></p></div>`,
    `<button class="btn btn-ghost" onclick="closeModal();go('riwayat');render()">Lihat Riwayat</button>
     <button class="btn btn-primary" onclick="closeModal();go('pengajuan-offline');render()">Buat Lagi</button>`);
}

}
function submitIKM(requestId) {
  const u = currentUser();
  const r = DB.serviceRequests.find(x => x.id === requestId); if (!r) return;
  const jawaban = {};
  for (const q of IKM_PERTANYAAN) {
    const sel = document.querySelector(`input[name="${q.id}"]:checked`);
    if (!sel) return toast('Semua pertanyaan wajib dijawab.', 'error');
    jawaban[q.id] = parseInt(sel.value);
  }
  if (!$('#ikmJK').value) return toast('Jenis kelamin wajib dipilih.', 'error');
  if (!$('#ikmSaran').value.trim()) return toast('Saran wajib diisi.', 'error');
  const nilaiArr = Object.values(jawaban);
  const rata = nilaiArr.reduce((a, b) => a + b, 0) / nilaiArr.length;
  const nilaiIKM = ((rata) * 25).toFixed(2);
  const fb = {
    id: uid('fb'), requestId, userId: u.id,
    nama: $('#ikmNama').value, usia: $('#ikmUsia').value,
    jenisKelamin: $('#ikmJK').value, jabatan: $('#ikmJabatan').value,
    opd: $('#ikmOPD').value, jenisLayanan: $('#ikmLayanan').value,
    jawaban, saran: $('#ikmSaran').value,
    nilaiIKM, verified: false, createdAt: new Date().toISOString()
  };
  DB.feedbacks.unshift(fb);
  notifyRole('pic', 'IKM Feedback Baru', `Feedback dari ${fb.nama} (${fb.opd}) — Nilai: ${fb.nilaiIKM}`, 'success');
  logAct(u, 'Isi IKM', r.nomor + ' — ' + nilaiIKM);
  saveDB();
  toast('Terima kasih! Nilai IKM: ' + nilaiIKM, 'success');
  closeModal(); render();
}

  <div class="box"><b>Catatan:</b> Bukti ini merupakan tanda terima permohonan layanan KLIK RAPA'I.</div>
  <div class="sign"><div>Sigli, ${tglID(new Date())}<br>Pemohon<br><br><br><br><u>${r.pemohon.nama}</u></div>
  <div>Petugas Pelayanan<br><br><br><br><br><u>${(DB.users.find(u => u.role === 'pic') || {}).nama || '________________'}</u></div></div>
  <div style="text-align:center;margin-top:30px"><button onclick="window.print()" style="padding:8px 20px;cursor:pointer">Cetak / Simpan PDF</button></div>
  </body></html>`);

}
function cancelRequest(id) {
  const r = DB.serviceRequests.find(x => x.id === id); if (!r) return;
  confirmAction('Batalkan permohonan <b>' + esc(r.nomor) + '</b>?', () => {
    r.status = 'Dibatalkan';
    r.riwayat.push({ status: 'Dibatalkan', waktu: new Date().toISOString(), oleh: currentUser().nama, ket: 'Dibatalkan pemohon' });
    notifyRole('pic', 'Permohonan Dibatalkan', `${r.nomor} dibatalkan.`, 'warning');
    logAct(currentUser(), 'Batalkan Permohonan', r.nomor);
    saveDB(); closeModal(); toast('Permohonan dibatalkan.', 'success'); render();
  }, 'Ya, Batalkan');
}
function editRequest(id) {
  const r = DB.serviceRequests.find(x => x.id === id); if (!r) return;
  openModal('Edit Permohonan', `
    <div class="field"><label>Keperluan</label><input class="input" id="edKeperluan" value="${esc(r.keperluan)}"></div>
    <div class="field"><label>Deskripsi</label><textarea class="input" id="edDeskripsi">${esc(r.deskripsi)}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn btn-primary" onclick="saveEditRequest('${id}')">Simpan</button>`);
}
function saveEditRequest(id) {
  const r = DB.serviceRequests.find(x => x.id === id); if (!r) return;
  r.keperluan = $('#edKeperluan').value;
  r.deskripsi = $('#edDeskripsi').value;
  r.riwayat.push({ status: r.status, waktu: new Date().toISOString(), oleh: currentUser().nama, ket: 'Permohonan diperbarui' });
  saveDB(); closeModal(); toast('Data diperbarui.', 'success'); render();
}

/* ==================== NOTIF PAGE ==================== */

          <i class="fa-solid fa-bell"></i> Aktifkan Notifikasi Browser</button>` : ''}

    </div></div>

      <div class="li-ico"><i class="fa-solid ${notifIcon(n.type)}"></i></div>
      <div style="flex:1"><h4>${esc(n.title)} ${n.read ? '' : '<span class="badge bg-reject" style="margin-left:6px">Baru</span>'}</h4>

        <div class="meta mt8"><span><i class="fa-regular fa-clock"></i> ${waktuID(n.createdAt)}</span></div></div>
      <button class="btn btn-ghost btn-xs" onclick="deleteNotif('${n.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('')
      : `<div class="empty"><i class="fa-regular fa-bell"></i><h4>Belum ada notifikasi</h4></div>`}

function deleteNotif(id) {
  const i = DB.notifications.findIndex(n => n.id === id);
  if (i > -1) { DB.notifications.splice(i, 1); saveDB(); toast('Dihapus.', 'success'); render(); }
}

function saveProfil() {
  const u = currentUser(); if (!u) return;
  u.nama = $('#pfNama').value.trim() || u.nama;
  u.jabatan = $('#pfJabatan').value.trim();
  if (u.role === 'pelaksana') u.bidang = $('#pfInstansi').value.trim();
  else u.instansi = $('#pfInstansi').value.trim();
  u.hp = $('#pfHp').value.trim(); u.email = $('#pfEmail').value.trim();
  logAct(u, 'Update Profil', 'Data profil diperbarui');
  saveDB(); toast('Data diperbarui.', 'success'); render();
}
function viewGantiPassword(user) {
  return `<div class="card" style="max-width:520px">
    <div class="card-h"><h3><i class="fa-solid fa-key"></i> Ganti Password</h3></div>
    <div class="field"><label>Password Lama <span class="req">*</span></label>
      <div class="pw-wrap"><input class="input" type="password" id="pwOld">
        <button type="button" class="toggle-pw" onclick="togglePw('pwOld',this)"><i class="fa-solid fa-eye"></i></button></div></div>
    <div class="field"><label>Password Baru <span class="req">*</span></label>
      <div class="pw-wrap"><input class="input" type="password" id="pwNew">
        <button type="button" class="toggle-pw" onclick="togglePw('pwNew',this)"><i class="fa-solid fa-eye"></i></button></div></div>
    <div class="field"><label>Konfirmasi Password Baru <span class="req">*</span></label>
      <div class="pw-wrap"><input class="input" type="password" id="pwConfirm">
        <button type="button" class="toggle-pw" onclick="togglePw('pwConfirm',this)"><i class="fa-solid fa-eye"></i></button></div></div>
    <button class="btn btn-primary" onclick="savePassword()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
  </div>`;
}
function savePassword() {
  const u = currentUser(); if (!u) return;
  const o = $('#pwOld').value, n = $('#pwNew').value, c = $('#pwConfirm').value;
  if (o !== u.password) return toast('Password lama salah.', 'error');
  if (n.length < 6) return toast('Minimal 6 karakter.', 'error');
  if (n !== c) return toast('Konfirmasi tidak sama.', 'error');
  u.password = n; logAct(u, 'Ganti Password', '');
  saveDB(); toast('Password diubah.', 'success');
  $('#pwOld').value = $('#pwNew').value = $('#pwConfirm').value = '';
}

/* ============================================================
   USER PELAKSANA
   ============================================================ */
function myAssignments(user) { return DB.assignments.filter(a => a.executorId === user.id).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); }
function pagePelaksana(page, user) {
  switch (page) {
    case 'dashboard': return viewPelaksanaDashboard(user);
    case 'tugas-masuk': return viewTugasList(user, 'masuk');
    case 'tugas-proses': return viewTugasList(user, 'proses');
    case 'tugas-selesai': return viewTugasList(user, 'selesai');
    case 'tugas-riwayat': return viewTugasList(user, 'riwayat');
    case 'notifikasi': return viewNotifikasiPage(user);
    case 'profil': return viewProfilPage(user);
    case 'ganti-password': return viewGantiPassword(user);
    default: return viewPelaksanaDashboard(user);
  }
}
function viewPelaksanaDashboard(user) {
  const asg = myAssignments(user);
  const baru = asg.filter(a => a.status === 'Menunggu Respon').length;
  const proses = asg.filter(a => ['Diterima Pelaksana', 'Diproses'].includes(a.status)).length;
  const selesai = asg.filter(a => a.status === 'Selesai').length;
  const tolak = asg.filter(a => a.status === 'Ditolak').length;
  const overdue = asg.filter(a => a.deadline && new Date(a.deadline) < new Date() && a.status !== 'Selesai' && a.status !== 'Ditolak').length;
  const recent = asg.slice(0, 6);
  return `<div class="mb16"><h2 style="font-size:20px;font-weight:800;color:var(--navy)">Selamat datang, ${esc(user.nama)} 👋</h2>
    <p class="muted">${esc(user.jabatan || 'Perencana')} · ${esc(user.bidang || '-')}</p></div>
  ${overdue ? `<div class="alert err"><i class="fa-solid fa-triangle-exclamation"></i>
    <div><b>${overdue} penugasan melewati deadline!</b> Segera selesaikan.</div></div>` : ''}
  <div class="stats mb24">
    ${statCard('fa-inbox', 'yellow', baru, 'Penugasan Baru')}
    ${statCard('fa-spinner', 'purple', proses, 'Sedang Diproses')}
    ${statCard('fa-circle-check', 'green', selesai, 'Selesai')}
    ${statCard('fa-circle-xmark', 'red', tolak, 'Ditolak')}
  </div>
  <div class="card"><div class="card-h"><h3><i class="fa-solid fa-list-check"></i> Penugasan Terbaru</h3>
    <a href="#/tugas-masuk" class="btn btn-ghost btn-sm">Lihat Semua</a></div>
    ${recent.length ? `<div class="table-wrap"><table class="tbl">
      <thead><tr><th>No</th><th>Nomor</th><th>Pemohon</th><th>Keperluan</th><th>Deadline & Sisa Waktu</th><th>Status</th><th></th></tr></thead>
      <tbody>${recent.map((a, i) => {
        const r = DB.serviceRequests.find(x => x.id === a.requestId); if (!r) return '';
        const od = a.deadline && new Date(a.deadline) < new Date() && a.status !== 'Selesai';
        return `<tr><td>${i + 1}</td><td><b style="color:var(--navy);font-size:12.5px">${esc(r.nomor)}</b></td>
          <td>${esc(r.pemohon.nama)}<div class="small muted">${esc(r.pemohon.instansi)}</div></td>
          <td>${esc(r.keperluan)}</td>
          <td style="${od ? 'color:var(--red);font-weight:700' : ''}">${a.deadline ? tglShort(a.deadline) : '-'}
            ${a.deadline && a.status !== 'Selesai' && a.status !== 'Ditolak'
              ? `<div class="mt8"><span class="chip countdown-chip" data-deadline="${a.deadline}"><i class="fa-solid fa-stopwatch"></i> …</span></div>` : ''}
          </td>
          <td>${badge(a.status)}</td>
          <td><button class="btn btn-ghost btn-xs" onclick="detailTugas('${a.id}')">Detail</button></td></tr>`;
      }).join('')}</tbody></table></div>`
      : `<div class="empty"><i class="fa-solid fa-inbox"></i><h4>Belum ada penugasan</h4></div>`}
  </div>`;
}
function viewTugasList(user, mode) {
  const all = myAssignments(user);
  let list = all, title = '';
  if (mode === 'masuk') { list = all.filter(a => a.status === 'Menunggu Respon'); title = 'Penugasan Masuk'; }
  else if (mode === 'proses') { list = all.filter(a => ['Diterima Pelaksana', 'Diproses'].includes(a.status)); title = 'Sedang Diproses'; }
  else if (mode === 'selesai') { list = all.filter(a => a.status === 'Selesai'); title = 'Selesai'; }
  else { list = all; title = 'Riwayat Penugasan'; }
  return `<div class="card"><div class="card-h"><h3><i class="fa-solid fa-diagram-project"></i> ${title}</h3>
    <span class="badge bg-accept">${list.length} penugasan</span></div>
    ${list.length ? list.map(a => {
      const r = DB.serviceRequests.find(x => x.id === a.requestId); if (!r) return '';
      return `<div class="list-item"><div class="li-ico"><i class="fa-solid ${r.jenis === 'offline' ? 'fa-building' : 'fa-globe'}"></i></div>
        <div style="flex:1"><h4>${esc(r.nomor)}</h4>
          <div class="meta">
            <span><i class="fa-solid fa-user"></i> ${esc(r.pemohon.nama)}</span>
            <span><i class="fa-solid fa-building"></i> ${esc(r.pemohon.instansi)}</span>
            <span><i class="fa-solid fa-tag"></i> ${esc(r.keperluan)}</span>
          </div>
          <div class="flex gap8 wrap mt8">
            ${jenisBadge(r.jenis)}${badge(a.status)}
            ${a.deadline && a.status !== 'Selesai' && a.status !== 'Ditolak'
              ? `<span class="chip countdown-chip" data-deadline="${a.deadline}"><i class="fa-solid fa-stopwatch"></i> …</span>
                 <span class="chip" style="background:#f1f5fb;color:#64748b"><i class="fa-regular fa-calendar"></i> ${tglShort(a.deadline)}</span>`
              : (a.deadline ? `<span class="chip green"><i class="fa-regular fa-clock"></i> Deadline ${tglShort(a.deadline)}</span>` : '')}
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="detailTugas('${a.id}')"><i class="fa-solid fa-eye"></i> Kelola</button>
      </div>`;
    }).join('') : `<div class="empty"><i class="fa-solid fa-inbox"></i><h4>Tidak ada penugasan</h4></div>`}
  </div>`;
}
function detailTugas(id) {
  const a = DB.assignments.find(x => x.id === id); if (!a) return;
  const r = DB.serviceRequests.find(x => x.id === a.requestId); if (!r) return;

    aksi = `<button class="btn btn-success" onclick="terimaTugas('${a.id}')"><i class="fa-solid fa-check"></i> Terima</button>
            <button class="btn btn-danger" onclick="formTolakTugas('${a.id}')"><i class="fa-solid fa-xmark"></i> Tolak</button>`;
  } else if (a.status === 'Diterima Pelaksana') {
    aksi = `<button class="btn btn-primary" onclick="prosesTugas('${a.id}')"><i class="fa-solid fa-spinner"></i> Mulai Proses</button>`;
  } else if (a.status === 'Diproses') {
    aksi = `<button class="btn btn-success" onclick="formSelesaiTugas('${a.id}')"><i class="fa-solid fa-flag-checkered"></i> Selesaikan</button>`;
  }

    <div class="flex between center mb16 wrap gap12">
      <div><div style="font-weight:800;color:var(--navy);font-size:15px">${esc(r.nomor)}</div>

        <div>
          <div style="font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8"><i class="fa-solid fa-stopwatch"></i> Sisa Waktu</div>
          <div style="font-size:13px;opacity:.9;margin-top:3px">Deadline: ${tglID(a.deadline)}</div>
        </div>
        <div class="countdown-big" data-deadline="${a.deadline}" style="font-family:monospace;font-size:28px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.3)">—</div>
      </div>` : ''}
    ${deadlinePassed && a.status !== 'Selesai' && a.status !== 'Ditolak' ? `<div class="alert err"><i class="fa-solid fa-triangle-exclamation"></i>
      <div><b>Perhatian!</b> Deadline telah lewat pada ${tglID(a.deadline)}.</div></div>` : ''}
    <div class="grid2">
      <div class="field"><label>Nama Pemohon</label><div>${esc(r.pemohon.nama)}</div></div>
      <div class="field"><label>Instansi</label><div>${esc(r.pemohon.instansi)}</div></div>
      <div class="field"><label>Jabatan</label><div>${esc(r.pemohon.jabatan)}</div></div>
      <div class="field"><label>Kontak</label><div>${esc(r.pemohon.hp)}</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Jenis Layanan</label><div><b>${esc(r.jenisLayanan || '-')}</b></div></div>
      <div class="field"><label>Keperluan</label><div>${esc(r.keperluan)}</div></div>
    </div>
    <div class="field"><label>Deskripsi</label><div style="color:#4a5b75">${esc(r.deskripsi)}</div></div>
    ${r.jadwal ? `<div class="grid3">
      <div class="field"><label>Tanggal</label><div>${tglID(r.jadwal.tanggal)}</div></div>
      <div class="field"><label>Hari</label><div>${esc(r.jadwal.hari)}</div></div>
      <div class="field"><label>Sesi</label><div>${esc(r.jadwal.sesi)}</div></div></div>` : ''}
    ${r.file ? `<div class="field"><label>Dokumen Pemohon</label>
      <div class="flex center gap8" style="background:#f6f9fe;padding:10px 13px;border-radius:9px">
        <i class="fa-solid fa-file-pdf" style="color:var(--red);font-size:18px"></i>
        <div style="flex:1"><b style="font-size:12.8px">${esc(r.file.name)}</b><div class="small muted">${bytes(r.file.size)}</div></div>
        <button class="btn btn-ghost btn-xs" onclick="downloadFile(DB.serviceRequests.find(x=>x.id==='${r.id}').file)"><i class="fa-solid fa-download"></i></button></div></div>` : ''}
    <div class="card" style="background:#f6f9fe;box-shadow:none">
      <div class="small" style="font-weight:800;color:var(--navy);margin-bottom:9px"><i class="fa-solid fa-user-tie" style="color:var(--blue)"></i> Informasi Penugasan</div>
      <div class="grid2">
        <div><div class="small muted">Operator (PIC)</div><b style="font-size:13px">${esc(pic ? pic.nama : '-')}</b></div>

let charts = {};
function initCharts() {

    options: { responsive: true, cutout: '62%', plugins: { legend: { position: 'bottom' } } } });
  const el3 = $('#chartStatus');

    const labels = STATUSES.filter(s => s !== 'Dibatalkan');
    charts.status = new Chart(el3, { type: 'bar',
      data: { labels, datasets: [{ label: 'Jumlah', data: labels.map(s => reqs.filter(r => r.status === s).length), backgroundColor: ['#F5B800', '#0D5BD7', '#6D3BBF', '#0F9D58', '#E31B23'], borderRadius: 7 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }
  const el4 = $('#chartPelaksana');
  if (el4) {
    const map = {};
    DB.assignments.forEach(a => { const u = DB.users.find(x => x.id === a.executorId); if (u) map[u.nama] = (map[u.nama] || 0) + 1; });
    const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 8);
    charts.pelaksana = new Chart(el4, { type: 'bar',
      data: { labels: sorted.map(x => x[0].split(',')[0]), datasets: [{ label: 'Penugasan', data: sorted.map(x => x[1]), backgroundColor: '#082B68', borderRadius: 6 }] },
      options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }

function exportPICCSV(mode) {

function exportCSV(rows, filename) {
  if (!rows.length) return toast('Tidak ada data.', 'warn');
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(';')].concat(rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(';'))).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  toast('Data diexport.', 'success');
}

function kirimPenugasan(requestId) {
  const r = DB.serviceRequests.find(x => x.id === requestId); if (!r) return;
  const execId = $('#pgPerencanaId').value;
  const deadline = $('#pgDeadline').value;
  const catatan = $('#pgCatatan').value.trim();
  if (!execId) return toast('Perencana wajib dipilih.', 'error');
  if (!deadline) return toast('Deadline wajib diisi.', 'error');
  const u = currentUser();
  const exec = DB.users.find(x => x.id === execId);
  const asg = {
    id: uid('asg'), requestId: r.id, serviceUserId: r.userId, executorId: execId,
    picId: u.id, perencana: exec.nama, perencanaJabatan: exec.jabatan,
    catatan, deadline, status: 'Menunggu Respon',
    alasanTolak: '', hasilFile: null, catatanHasil: '',
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  DB.assignments.unshift(asg);
  r.status = 'Diproses';
  r.riwayat.push({ status: 'Diproses', waktu: new Date().toISOString(), oleh: u.nama, ket: 'Ditugaskan ke ' + exec.nama + ' (Deadline: ' + tglShort(deadline) + ')' });

  saveDB(); closeModal(); toast('Penugasan dikirim ke ' + exec.nama + '.', 'success'); render();
}

function initChartsMonitoring() {
  if (typeof Chart === 'undefined') return;
  ['monsStatus', 'monsBidang'].forEach(k => { try { charts[k].destroy(); } catch (e) { } });
  const asg = DB.assignments;
  const el1 = $('#chartMonsStatus');
  if (el1) {
    const labels = ['Menunggu Respon', 'Diterima Pelaksana', 'Diproses', 'Selesai', 'Ditolak'];
    charts.monsStatus = new Chart(el1, { type: 'bar',
      data: { labels, datasets: [{ label: 'Penugasan', data: labels.map(s => asg.filter(a => a.status === s).length), backgroundColor: ['#F5B800', '#0D5BD7', '#6D3BBF', '#0F9D58', '#E31B23'], borderRadius: 7 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }
  const el2 = $('#chartMonsBidang');
  if (el2) {
    const map = {};
    asg.forEach(a => {
      const u = DB.users.find(x => x.id === a.executorId);
      let b = (u && u.bidang) ? u.bidang : 'Lainnya';
      b = b.replace(/^Bidang Perencanaan,?\s*/i, '').replace(/^Bidang /i, '');
      map[b] = (map[b] || 0) + 1;

    charts.monsBidang = new Chart(el2, { type: 'doughnut',
      data: { labels: entries.map(x => x[0]), datasets: [{ data: entries.map(x => x[1]), backgroundColor: ['#0D5BD7', '#F5B800', '#0F9D58', '#6D3BBF', '#E31B23', '#082B68'], borderWidth: 0 }] },
      options: { responsive: true, cutout: '58%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } } });
  }
}

function saveJadwal(id) {
  const tanggal = $('#jdTanggal').value, sesi = $('#jdSesi').value;
  const kapasitas = parseInt($('#jdKapasitas').value) || 1;
  const active = $('#jdActive').value === '1';
  if (!tanggal) return toast('Tanggal wajib diisi.', 'error');
  const dup = DB.schedules.find(s => s.tanggal === tanggal && s.sesi === sesi && s.id !== id);
  if (dup) return toast('Jadwal duplikat.', 'error');
  if (id) { Object.assign(DB.schedules.find(x => x.id === id), { tanggal, sesi, kapasitas, active }); toast('Diperbarui.', 'success'); }
  else { DB.schedules.push({ id: uid('sch'), tanggal, sesi, kapasitas, active }); toast('Ditambahkan.', 'success'); }
  logAct(currentUser(), id ? 'Edit Jadwal' : 'Tambah Jadwal', tanggal + ' ' + sesi);
  saveDB(); closeModal(); render();
}
function hapusJadwal(id) {
  confirmAction('Hapus jadwal ini?', () => {
    DB.schedules = DB.schedules.filter(s => s.id !== id);
    saveDB(); toast('Dihapus.', 'success'); render();
  });
}

function handlePhotoUpload(input) {
  const f = input.files[0];
  if (!f) return;
  if (!/^image\/(jpeg|jpg|png)$/i.test(f.type)) {
    toast('Format harus JPG atau PNG.', 'error', 'Validasi');
    input.value = ''; return;
  }
  if (f.size > APP.maxPhotoSize) {
    toast(`Ukuran foto maksimal ${bytes(APP.maxPhotoSize)}.`, 'error', 'Validasi');
    input.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    $('#eFotoData').value = data;
    const prev = $('#photoPreview');
    prev.innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover;object-position:center top;position:relative;z-index:2">`;
    $('#fotoInfo').textContent = `Foto siap disimpan (${bytes(f.size)}).`;
    toast('Foto berhasil dimuat.', 'success');
  };
  reader.readAsDataURL(f);
}
function clearPhoto() {
  $('#eFotoData').value = '';
  const nama = $('#eNama')?.value || '';

    ? `<span class="init">${initials(nama)}</span>`

  $('#fotoInfo').textContent = 'Foto dihapus. Akan tampil sebagai inisialisasi nama.';
  const inp = $('#eFoto'); if (inp) inp.value = '';
}

function restoreDB(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.users || !data.serviceRequests) throw new Error('Format tidak valid');
      confirmAction('Restore akan menimpa seluruh data. Lanjutkan?', () => {
        DB = data; saveDB();
        loadPerencanaPhotos();
        syncPerencanaDataFromUsers();
        logAct(currentUser(), 'Restore Database', '');
        toast('Database dipulihkan.', 'success'); render();
      }, 'Ya, Restore');
    } catch (err) { toast('File tidak valid.', 'error'); }
  };
  reader.readAsText(f); input.value = '';
}

/* ============================================================
   COUNTDOWN DEADLINE
   ============================================================ */
function tickCountdowns() {
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const dl = el.dataset.deadline;
    if (!dl) return;
    const end = new Date(dl + 'T23:59:59').getTime();
    const diff = end - Date.now();
    const abs = Math.abs(diff);
    const d = Math.floor(abs / 86400000);
    const h = Math.floor((abs % 86400000) / 3600000);
    const m = Math.floor((abs % 3600000) / 60000);
    const s = Math.floor((abs % 60000) / 1000);
    const timeStr = (d > 0 ? d + 'h ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
    let text, cls;
    if (diff <= 0) { text = timeStr + ' lewat'; cls = 'red'; }
    else { text = timeStr; cls = d < 1 ? 'red' : (d <= 3 ? 'yellow' : 'green'); }

    if (el.classList.contains('countdown-big')) {
      el.textContent = (diff <= 0 ? '-' : '') + timeStr;
      el.style.color = cls === 'red' ? '#FF8A8A' : (cls === 'yellow' ? '#FFD34D' : '#7CE7AE');
    } else if (el.classList.contains('countdown-chip')) {
      el.className = 'chip countdown-chip ' + cls;
      el.innerHTML = `<i class="fa-solid fa-stopwatch"></i> ${text}`;
    } else {
      el.textContent = text;
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  loadDB();
  loadPerencanaPhotos();
  syncPerencanaDataFromUsers();
  if (notifSupported() && Notification.permission === 'granted') {
    await registerServiceWorker();
    if (localStorage.getItem(NOTIF_PREF_KEY) === null) {
      localStorage.setItem(NOTIF_PREF_KEY, '1');
    }
  }
  render();
  startClock();
  setInterval(tickCountdowns, 1000);
  tickCountdowns();
  initNotifPolling();
  const observer = new MutationObserver(() => {
    if ($('#reqTableWrap') && !$('#reqTableWrap').innerHTML.trim()) renderReqTable('layanan');
    if ($('#picTableWrap') && !$('#picTableWrap').innerHTML.trim()) {
      const m = location.hash.replace('#/', '');
      renderPICTable(m === 'pengajuan-baru' ? 'baru' : m === 'pelayanan-offline' ? 'offline'
        : m === 'pelayanan-online' ? 'online' : m === 'pelayanan-selesai' ? 'selesai' : 'semua');
    }
    if ($('#ulTableWrap') && !$('#ulTableWrap').innerHTML.trim()) renderUserLayananTable();
    if ($('#upTableWrap') && !$('#upTableWrap').innerHTML.trim()) renderUserPelaksanaTable();
  });
  observer.observe($('#app'), { childList: true, subtree: true });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900) { $('#sidebar')?.classList.remove('open'); $('#sbOverlay')?.classList.remove('active'); }
  });
  document.addEventListener('click', e => {
    const dd = $('#notifDD');
    if (dd && dd.innerHTML.trim() && !e.target.closest('.bell') && !e.target.closest('.notif-dd')) dd.innerHTML = '';
  });
  window.addEventListener('storage', e => {
    if (e.key === LS_KEY && e.newValue) {
      try {
        const fresh = JSON.parse(e.newValue);
        const cur = currentUser();
        if (cur && fresh.notifications) {
          const mine = fresh.notifications.filter(n => n.userId === cur.id);
          if (mine.length) {
            const top = mine[0];
            if (top && top.id !== _lastTopNotifId && !top.read) {
              showBrowserNotification(top.title, top.message, top.link || '', top.id);
              _lastTopNotifId = top.id;
              const dot = document.querySelector('.bell .dot');
              if (dot) render();
            }
          }
        }
      } catch (err) { /* ignore */ }
    }
  });
}
init();
</script>
