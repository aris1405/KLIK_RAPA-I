<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIK RAPA'I v6 — BAPPEDA Kabupaten Pidie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* =========================================================
   KLIK RAPA'I v6.0 — Elegant Edition
   Design tokens
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#062352; --navy-2:#082B68; --blue:#0D5BD7; --blue-2:#1a72e8;
  --lightblue:#EAF4FF; --white:#FFFFFF;
  --red:#E31B23; --yellow:#F5B800; --yellow-2:#FFD34D;
  --green:#0F9D58; --purple:#6D3BBF;
  --gray:#64748b; --gray-2:#94a3b8; --border:#e6ecf5;
  --bg:#f6f8fc; --bg-2:#eff3fa; --text:#0f1a30;
  --radius:14px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(8,43,104,.04);
  --shadow:0 2px 8px rgba(8,43,104,.04), 0 8px 24px rgba(8,43,104,.06);
  --shadow-lg:0 4px 16px rgba(8,43,104,.06), 0 24px 56px rgba(8,43,104,.12);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --trans-fast:.2s var(--ease);
  --trans-med:.35s var(--ease);
  --trans-slow:.55s var(--ease-out);
}
html{scroll-behavior:smooth}html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c8d3e2;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#a8b8ce;background-clip:padding-box;border:2px solid transparent}
img{max-width:100%;display:block}

/* =========================================================
   LOADING SCREEN
   ========================================================= */
#loadingScreen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, #0D5BD7 0%, #082B68 45%, #062352 100%);
  transition:opacity .65s var(--ease-out),visibility .65s;
}
#loadingScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
.load-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;max-width:420px;text-align:center}
.load-logo{width:104px;height:104px;animation:logoFloat 2.4s ease-in-out infinite}
.load-logo svg,.load-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 32px rgba(245,184,0,.4))}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
.load-title{color:#fff;font-size:24px;font-weight:800;letter-spacing:.6px;margin-bottom:2px}
.load-sub{color:rgba(255,255,255,.72);font-size:12.5px;letter-spacing:.3px;line-height:1.5}
.load-bar{width:100%;max-width:280px;height:3px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:10px}
.load-bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#F5B800,#FFD34D);
  border-radius:99px;transition:width .35s var(--ease);box-shadow:0 0 14px rgba(245,184,0,.8)}
.load-status{color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.6px;font-variant-numeric:tabular-nums;text-transform:uppercase;font-weight:600}
.load-dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.load-dots span{width:4px;height:4px;border-radius:50%;background:#F5B800;animation:dotBounce 1.3s infinite}
.load-dots span:nth-child(2){animation-delay:.18s}
.load-dots span:nth-child(3){animation-delay:.36s}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

/* =========================================================
   PAGE TRANSITION
   ========================================================= */
#pageTransition{
  transition:opacity .28s var(--ease), transform .28s var(--ease);
  will-change:opacity,transform;
}
#pageTransition.swapping{opacity:0;transform:translateY(10px);pointer-events:none}

/* =========================================================
   UTILITIES
   ========================================================= */
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.txt-c{text-align:center}.txt-r{text-align:right}
.muted{color:var(--gray)}.small{font-size:12.5px}.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* =========================================================
   BUTTONS with SPLASH HOVER
   ========================================================= */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;font-weight:600;font-size:13.5px;
  transition:transform var(--trans-fast),box-shadow var(--trans-fast),background var(--trans-fast);
  white-space:nowrap;border:1.5px solid transparent;
  overflow:hidden;isolation:isolate;z-index:1;letter-spacing:.1px;
}
.btn>*{position:relative;z-index:3}
.btn::before{
  content:'';position:absolute;inset:-50%;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.5) 0%,transparent 60%);
  opacity:0;transform:scale(.2);
  transition:transform .65s var(--ease-out),opacity .4s var(--ease);
  pointer-events:none;
}
.btn:hover::before{opacity:1;transform:scale(1.6)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0a4bb5;box-shadow:0 8px 20px rgba(13,91,215,.32)}
.btn-navy{background:var(--navy-2);color:#fff}
.btn-navy:hover{background:#051d47;box-shadow:0 8px 20px rgba(8,43,104,.32)}
.btn-yellow{background:var(--yellow);color:#3a2b00}
.btn-yellow:hover{background:#e0a800;box-shadow:0 8px 20px rgba(245,184,0,.4)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#c0151c;box-shadow:0 8px 20px rgba(227,27,35,.3)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#0c8148;box-shadow:0 8px 20px rgba(15,157,88,.3)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#5a2fa0}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:#f5f8fd;border-color:#c9d7ea;box-shadow:var(--shadow-sm)}
.btn-outline{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(8px)}
.btn-outline:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.8)}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px;background:#f1f5fb;color:var(--navy)}
.btn-icon:hover{background:#e2ecfa}

/* =========================================================
   BADGES
   ========================================================= */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;
  border-radius:999px;font-size:11.5px;font-weight:700;
  letter-spacing:.2px;white-space:nowrap;line-height:1.4;
}
.bg-wait{background:#FFF4D6;color:#8a6100}
.bg-accept{background:#E1EEFF;color:#0b4bb0}
.bg-process{background:#EFE6FF;color:#5b28a8}
.bg-done{background:#DDF6E8;color:#0a7a44}
.bg-reject{background:#FFE2E3;color:#b3121a}
.bg-cancel{background:#ECEFF4;color:#5a6678}
.bg-offline{background:#EAF4FF;color:#0b4bb0}
.bg-online{background:#E6F7F1;color:#0a7a44}

/* =========================================================
   CARDS
   ========================================================= */
.card{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid var(--border);
  padding:22px;transition:box-shadow var(--trans-med);
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:18px;flex-wrap:wrap;
}
.card-h h3{
  font-size:16px;font-weight:800;color:var(--navy);
  display:flex;align-items:center;gap:10px;letter-spacing:-.2px;
}
.card-h h3 i{color:var(--blue);font-size:15px}

/* =========================================================
   FORM ELEMENTS
   ========================================================= */
.field{margin-bottom:16px}
.field label{
  display:block;font-size:12.5px;font-weight:700;
  color:#33425c;margin-bottom:7px;letter-spacing:.1px;
}
.field label .req{color:var(--red)}
.input,select.input,textarea.input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:10px;background:#fbfcfe;transition:all var(--trans-fast);
  color:var(--text);font-size:14px;
}
.input:hover{border-color:#c9d7ea}
.input:focus{
  outline:none;border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 4px rgba(13,91,215,.08);
}
.input[readonly]{background:#f1f5fb;cursor:not-allowed;border-color:#e6ecf5}
textarea.input{resize:vertical;min-height:92px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pw-wrap{position:relative}
.pw-wrap .toggle-pw{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--gray);padding:8px;border-radius:6px;transition:var(--trans-fast);
}
.pw-wrap .toggle-pw:hover{background:#f1f5fb;color:var(--navy)}

/* =========================================================
   STICKY PUBLIC HEADER
   ========================================================= */
.pub-header{
  position:sticky;top:0;z-index:300;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.5);
  box-shadow:0 4px 24px rgba(8,43,104,.05);
  transition:background var(--trans-med),box-shadow var(--trans-med);
}
.pub-header.scrolled{
  background:rgba(255,255,255,.88);
  box-shadow:0 6px 30px rgba(8,43,104,.1);
}
.pub-inner{
  max-width:1280px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:20px;
}
.brand{
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;cursor:pointer;
}
.brand .logo-box{
  width:52px;height:52px;flex-shrink:0;
  transition:transform var(--trans-slow);
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;overflow:hidden;
}
.brand .logo-box img{width:100%;height:100%;object-fit:contain;}
.brand .logo-box svg{width:100%;height:100%}
.brand:hover .logo-box{transform:rotate(-5deg) scale(1.06)}
.brand .bt{line-height:1.2}
.brand .bt strong{
  display:block;font-size:15.5px;font-weight:800;
  color:var(--navy);letter-spacing:.3px;
}
.brand .bt span{
  font-size:11px;color:var(--gray);font-weight:600;
  letter-spacing:.2px;display:block;
}
.pub-nav{
  position:relative;display:flex;align-items:center;gap:2px;flex:1;
  overflow-x:auto;scrollbar-width:none;
  padding:5px;border-radius:14px;
  background:rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 2px 12px rgba(8,43,104,.04);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.pub-nav::-webkit-scrollbar{display:none}
.pub-nav a{
  position:relative;z-index:2;padding:9px 15px;
  border-radius:9px;font-size:12.8px;font-weight:600;
  color:#3a4a63;white-space:nowrap;
  transition:color var(--trans-fast),background var(--trans-fast);
}
.pub-nav a:hover{color:var(--blue);background:rgba(13,91,215,.06)}
.pub-nav a.active{color:#fff;font-weight:700}
.pub-nav a.active::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:9px;
  background:linear-gradient(135deg,#0D5BD7,#082B68);
  box-shadow:0 6px 18px rgba(13,91,215,.35),inset 0 1px 0 rgba(255,255,255,.15);
}
.pub-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hamburger{
  display:none;width:42px;height:42px;border-radius:11px;
  background:#f1f5fb;color:var(--navy);font-size:17px;
  transition:var(--trans-fast);
}
.hamburger:hover{background:#e2ecfa}

/* =========================================================
   HERO
   ========================================================= */
.hero{
  background:linear-gradient(135deg,#082B68 0%,#0D5BD7 55%,#1a72e8 100%);
  color:#fff;padding:72px 0 88px;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;right:-140px;top:-140px;
  width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,184,0,.28),transparent 65%);
  animation:heroFloat 12s ease-in-out infinite;
}
.hero::before{
  content:'';position:absolute;left:-160px;bottom:-220px;
  width:480px;height:480px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  animation:heroFloat 15s ease-in-out infinite reverse;
}
@keyframes heroFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-24px,-24px) scale(1.05)}
}
.hero-inner{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1.4fr .9fr;gap:48px;
  align-items:center;
}
.hero h1{
  font-size:38px;font-weight:800;line-height:1.22;
  margin-bottom:16px;letter-spacing:-.6px;
}
.hero p{
  font-size:15.5px;opacity:.94;max-width:640px;
  margin-bottom:28px;line-height:1.7;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);
  padding:7px 16px;border-radius:999px;
  font-size:12.5px;font-weight:700;margin-bottom:20px;
  backdrop-filter:blur(10px);
  letter-spacing:.2px;
}
.hero-badge i{color:var(--yellow-2)}
.hero-card{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.24);
  border-radius:24px;padding:32px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.2);
}
.hero-card .logo-box{width:120px;height:120px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}
.hero-card .logo-box svg,.hero-card .logo-box img{width:100%;height:100%;object-fit:contain}
.hero-card h3{font-size:18px;font-weight:800;margin-bottom:8px}
.hero-card p{font-size:13px;opacity:.9;margin:0;line-height:1.6}

/* =========================================================
   SECTIONS & REVEAL
   ========================================================= */
.section{padding:64px 0;position:relative}
.section-alt{background:#fff}
.sec-head{text-align:center;max-width:780px;margin:0 auto 44px}
.sec-head .kicker{
  display:inline-block;background:var(--lightblue);color:var(--blue);
  font-weight:800;font-size:11.5px;letter-spacing:1.2px;
  text-transform:uppercase;padding:7px 16px;
  border-radius:999px;margin-bottom:14px;
}
.sec-head h2{
  font-size:30px;font-weight:800;color:var(--navy);
  margin-bottom:12px;letter-spacing:-.5px;line-height:1.25;
}
.sec-head p{color:var(--gray);font-size:15px;line-height:1.7}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .75s var(--ease-out),transform .75s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal-left{opacity:0;transform:translateX(-36px);transition:opacity .75s var(--ease-out),transform .75s var(--ease-out)}
.reveal-left.in{opacity:1;transform:none}
.reveal-right{opacity:0;transform:translateX(36px);transition:opacity .75s var(--ease-out),transform .75s var(--ease-out)}
.reveal-right.in{opacity:1;transform:none}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .65s var(--ease-out),transform .65s var(--ease-out)}
.reveal-scale.in{opacity:1;transform:none}

/* =========================================================
   CARD GRID
   ========================================================= */
.grid-cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:22px;
}
.feature{
  background:#fff;border-radius:var(--radius);padding:26px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  transition:transform .35s var(--ease-out),box-shadow .35s var(--ease-out);
}
.feature:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.feature .ico{
  width:54px;height:54px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:17px;
  background:var(--lightblue);color:var(--blue);
  transition:transform .35s var(--ease-out);
}
.feature:hover .ico{transform:scale(1.08) rotate(-4deg)}
.feature .ico.y{background:#FFF4D6;color:#a97c00}
.feature .ico.r{background:#FFE2E3;color:var(--red)}
.feature .ico.g{background:#DDF6E8;color:var(--green)}
.feature .ico.p{background:#EFE6FF;color:var(--purple)}
.feature h4{font-size:15.5px;font-weight:800;color:var(--navy);margin-bottom:8px;line-height:1.4}
.feature p{font-size:13.5px;color:#5c6b82;line-height:1.65}

.list-item{
  display:flex;gap:16px;align-items:flex-start;
  padding:18px;border:1px solid var(--border);
  border-radius:13px;background:#fff;margin-bottom:12px;
  transition:all var(--trans-fast);
}
.list-item:hover{border-color:#bdd3f0;box-shadow:var(--shadow);transform:translateY(-1px)}
.list-item .li-ico{
  width:46px;height:46px;border-radius:12px;
  background:var(--lightblue);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.list-item h4{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:5px;line-height:1.4}
.list-item .meta{font-size:12px;color:var(--gray);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.list-item p{font-size:13px;color:#5c6b82;line-height:1.6}

.news-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  transition:transform .35s var(--ease-out),box-shadow .35s var(--ease-out);
}
.news-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.news-thumb{
  height:168px;background:linear-gradient(135deg,#0D5BD7,#082B68);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.4);font-size:44px;
  position:relative;overflow:hidden;
}
.news-thumb::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%, rgba(245,184,0,.3), transparent 60%);
}
.news-thumb i{position:relative;z-index:2}
.news-body{padding:20px}
.news-body h4{font-size:15px;font-weight:800;color:var(--navy);margin:10px 0 8px;line-height:1.45}
.news-body p{font-size:13px;color:#5c6b82;margin-bottom:14px;line-height:1.65}

.testi{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);
}
.testi .quote{font-size:14px;color:#41506a;font-style:italic;margin:16px 0 18px;line-height:1.7}
.testi .who{display:flex;align-items:center;gap:12px}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy-2),var(--blue));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--yellow);font-size:13px;display:flex;gap:2px}

/* =========================================================
   PLANNER CARD + GALLERY
   ========================================================= */
.planner-card{
  background:#fff;border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);
  overflow:hidden;transition:all .35s var(--ease-out);
  display:flex;flex-direction:column;cursor:pointer;
  position:relative;
}
.planner-card:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-lg);
  border-color:#bdd3f0;
}
.planner-photo{
  height:280px;
  background:linear-gradient(180deg,#E4EAF6 0%,#C9D9F0 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;color:#fff;
}
.planner-photo::before{
  content:'\f007';font-family:'Font Awesome 6 Free';font-weight:900;
  position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
  font-size:220px;color:rgba(8,43,104,.12);
  pointer-events:none;line-height:1;
}
.planner-photo .init{
  position:relative;z-index:2;font-size:68px;font-weight:800;
  color:#fff;text-shadow:0 6px 24px rgba(8,43,104,.35);
  letter-spacing:2px;
}
.planner-photo img{
  position:relative;z-index:2;width:100%;height:100%;
  object-fit:cover;object-position:center top;
  transition:transform .5s var(--ease-out);
}
.planner-card:hover .planner-photo img,
.planner-card:hover .planner-photo .init{
  transform:scale(1.08);
}
.planner-card::after{
  content:'\f00e';font-family:'Font Awesome 6 Free';font-weight:900;
  position:absolute;top:14px;right:14px;z-index:3;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.4);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;opacity:0;transform:scale(.8);
  transition:all .3s var(--ease-out);
  backdrop-filter:blur(8px);
}
.planner-card:hover::after{opacity:1;transform:scale(1)}
.planner-info{padding:18px;flex:1}
.planner-info h4{
  font-size:14px;font-weight:800;color:var(--navy);
  line-height:1.4;margin-bottom:6px;min-height:40px;
}
.planner-info .jab{
  font-size:11.5px;color:var(--blue);font-weight:700;
  margin-bottom:10px;display:inline-block;
  background:var(--lightblue);padding:4px 10px;border-radius:999px;
}
.planner-info .det{
  font-size:12px;color:#5c6b82;display:flex;gap:7px;
  align-items:flex-start;margin-bottom:5px;line-height:1.5;
}
.planner-info .det i{color:var(--blue);margin-top:3px;width:14px;text-align:center;flex-shrink:0}

.gallery-overlay{
  position:fixed;inset:0;z-index:1500;
  background:rgba(6,20,45,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
  padding:20px;animation:galleryFadeIn .3s var(--ease);
}
.gallery-overlay.active{display:flex}
@keyframes galleryFadeIn{from{opacity:0}to{opacity:1}}
.gallery-stage{
  position:relative;max-width:min(580px,92vw);width:100%;
  max-height:92vh;background:#fff;
  border-radius:22px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
  animation:galleryPop .4s var(--ease-out);
  display:flex;flex-direction:column;
}
@keyframes galleryPop{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:none}}
.gallery-photo{
  height:min(62vh,540px);
  background:linear-gradient(180deg,#E4EAF6,#C9D9F0);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.gallery-photo img{
  width:100%;height:100%;object-fit:contain;
  object-position:center;background:#f4f7fc;
}
.gallery-photo .init{
  font-size:110px;font-weight:800;color:#fff;
  text-shadow:0 8px 36px rgba(8,43,104,.45);
}
.gallery-info{padding:24px 28px;background:#fff;flex:1}
.gallery-info h3{
  color:var(--navy);font-size:19px;font-weight:800;
  margin-bottom:8px;line-height:1.35;
}
.gallery-info .jab{
  color:var(--blue);font-size:13px;font-weight:700;
  margin-bottom:14px;display:inline-block;
  background:var(--lightblue);padding:5px 12px;border-radius:999px;
}
.gallery-info .det{
  font-size:13.5px;color:#4a5b75;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;line-height:1.5;
}
.gallery-info .det i{color:var(--blue);width:18px;margin-top:3px;flex-shrink:0}
.gallery-close{
  position:absolute;top:16px;right:16px;z-index:10;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);
  transition:all .3s var(--ease);
}
.gallery-close:hover{background:rgba(0,0,0,.85);transform:rotate(90deg) scale(1.05)}
.gallery-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;
  width:52px;height:52px;border-radius:50%;
  background:rgba(0,0,0,.4);color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);
  transition:all .25s var(--ease);
}
.gallery-nav:hover{background:rgba(13,91,215,.9);transform:translateY(-50%) scale(1.1)}
.gallery-prev{left:14px}
.gallery-next{right:14px}
.gallery-counter{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.65);color:#fff;
  font-size:12.5px;font-weight:700;letter-spacing:.5px;
  padding:6px 16px;border-radius:99px;
  backdrop-filter:blur(10px);font-variant-numeric:tabular-nums;
}
.gallery-thumbs{
  display:flex;gap:10px;padding:14px 28px 22px;
  overflow-x:auto;background:#f8fbff;scrollbar-width:thin;
}
.gallery-thumbs::-webkit-scrollbar{height:5px}
.gallery-thumbs button{
  width:56px;height:72px;border-radius:10px;flex-shrink:0;
  overflow:hidden;border:2.5px solid transparent;
  background:#E4EAF6;color:var(--navy);
  font-weight:800;font-size:13px;
  transition:all .25s var(--ease);padding:0;
}
.gallery-thumbs button.active{
  border-color:var(--blue);
  box-shadow:0 6px 16px rgba(13,91,215,.35);
  transform:translateY(-3px);
}
.gallery-thumbs button img{width:100%;height:100%;object-fit:cover;object-position:center top}
.gallery-thumbs button:hover{transform:translateY(-3px)}

/* =========================================================
   ELEGANT LOGIN v2
   ========================================================= */
.login-wrap{
  min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;
  background:linear-gradient(135deg,#041a3d 0%,#082B68 45%,#0a3f91 100%);
  position:relative;overflow:hidden;
}

.login-left{
  position:relative;padding:60px 70px;
  display:flex;flex-direction:column;justify-content:center;
  color:#fff;overflow:hidden;z-index:2;
}

.login-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);
          mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);
  animation:gridShift 22s linear infinite;
}
@keyframes gridShift{from{background-position:0 0}to{background-position:52px 52px}}

.login-orb{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(72px);
  animation:orbFloat 14s ease-in-out infinite;
}
.login-orb.o1{width:340px;height:340px;top:-70px;left:-70px;
  background:radial-gradient(circle,rgba(13,91,215,.75),transparent 70%)}
.login-orb.o2{width:300px;height:300px;bottom:-60px;right:8%;
  background:radial-gradient(circle,rgba(245,184,0,.55),transparent 70%);
  animation-delay:-4s}
.login-orb.o3{width:240px;height:240px;top:42%;right:-70px;
  background:radial-gradient(circle,rgba(26,114,232,.65),transparent 70%);
  animation-delay:-8s}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(28px,-28px) scale(1.1)}
  66%{transform:translate(-18px,22px) scale(.94)}
}

.float-icon{
  position:absolute;width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:rgba(255,255,255,.72);
  animation:iconFloat 8s ease-in-out infinite;
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  pointer-events:none;
}
.float-icon.fi-1{top:10%;right:16%;color:#F5B800}
.float-icon.fi-2{top:26%;right:5%;animation-delay:-1.5s}
.float-icon.fi-3{bottom:28%;right:22%;color:#7BB0F0;animation-delay:-3s}
.float-icon.fi-4{bottom:11%;right:8%;animation-delay:-4.5s}
.float-icon.fi-5{top:56%;left:5%;animation-delay:-2s}
.float-icon.fi-6{bottom:18%;left:3%;color:#FFD34D;animation-delay:-5.5s}
@keyframes iconFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-14px) rotate(5deg)}
}

.login-content{position:relative;z-index:3;max-width:520px}

.login-logo{
  width:96px;height:96px;margin-bottom:26px;
  animation:logoPulse 4s ease-in-out infinite;
  filter:drop-shadow(0 12px 32px rgba(245,184,0,.45));
}
.login-logo svg,.login-logo img{width:100%;height:100%;object-fit:contain}
@keyframes logoPulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 12px 32px rgba(245,184,0,.45))}
  50%{transform:scale(1.05);filter:drop-shadow(0 16px 42px rgba(245,184,0,.65))}
}

.login-title{
  font-size:46px;font-weight:800;letter-spacing:-1.2px;
  line-height:1.08;margin-bottom:14px;
  background:linear-gradient(135deg,#fff 25%,#7BB0F0 65%,#F5B800);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.login-tagline{
  font-size:16px;color:rgba(255,255,255,.85);
  line-height:1.7;margin-bottom:34px;max-width:480px;
}
.login-tagline b{color:#F5B800;font-weight:700}

.login-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:16px;max-width:480px;
}
.login-stat{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:16px 14px;
  backdrop-filter:blur(12px);
  animation:statRise .9s var(--ease-out) both;
  transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease);
}
.login-stat:nth-child(2){animation-delay:.15s}
.login-stat:nth-child(3){animation-delay:.3s}
.login-stat:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}
@keyframes statRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.login-stat .num{
  font-size:26px;font-weight:800;color:#fff;display:block;
  line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px;
}
.login-stat .lbl{
  font-size:10.5px;color:rgba(255,255,255,.65);margin-top:6px;
  letter-spacing:.6px;text-transform:uppercase;font-weight:700;
}

.login-right{
  display:flex;align-items:center;justify-content:center;
  padding:40px;background:#f6f8fc;
  position:relative;overflow:hidden;
}
.login-right::before{
  content:'';position:absolute;top:-120px;right:-120px;
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(13,91,215,.09),transparent 70%);
}
.login-right::after{
  content:'';position:absolute;bottom:-100px;left:-100px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,184,0,.08),transparent 70%);
}

.login-box{
  width:100%;max-width:410px;position:relative;z-index:2;
  background:#fff;padding:42px 36px;border-radius:26px;
  box-shadow:
    0 4px 6px rgba(8,43,104,.02),
    0 20px 60px rgba(8,43,104,.08);
  border:1px solid rgba(230,236,245,.8);
  animation:cardIn .7s var(--ease-out) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:none}
}

.login-box .lg-head{text-align:center;margin-bottom:30px}
.login-box .lg-head .welcome-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--lightblue);color:var(--blue);
  padding:6px 14px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:14px;
}
.login-box .lg-head h2{
  font-size:23px;font-weight:800;color:var(--navy);
  margin-bottom:8px;letter-spacing:-.4px;
}
.login-box .lg-head p{
  font-size:13px;color:var(--gray);line-height:1.6;
}

.input-group{position:relative;margin-bottom:16px}
.input-group .input-icon{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  color:#94a3b8;font-size:15px;transition:color .25s var(--ease);
  pointer-events:none;z-index:2;
}
.input-group .elegant-input{
  width:100%;padding:17px 18px 17px 48px;
  border:1.5px solid #e6ecf5;border-radius:14px;
  background:#f9fbfe;font-size:14px;color:var(--text);
  transition:all .25s var(--ease);font-family:inherit;font-weight:500;
}
.input-group .elegant-input::placeholder{color:#9aa8bd;font-weight:500}
.input-group .elegant-input:hover{border-color:#c9d7ea;background:#fff}
.input-group .elegant-input:focus{
  outline:none;border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 4px rgba(13,91,215,.1);
}
.input-group:focus-within .input-icon{color:var(--blue)}
.input-group .toggle-pw{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#94a3b8;transition:all .2s var(--ease);background:transparent;
}
.input-group .toggle-pw:hover{background:#f1f5fb;color:var(--navy)}

.btn-login{
  width:100%;padding:17px;border-radius:14px;
  background:linear-gradient(135deg,#0D5BD7,#082B68);
  color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.3px;
  border:none;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:10px;margin-top:4px;
  transition:all .3s var(--ease);position:relative;overflow:hidden;
  box-shadow:0 10px 24px rgba(13,91,215,.25);
}
.btn-login::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#1a72e8,#0D5BD7);
  opacity:0;transition:opacity .3s;
}
.btn-login>*{position:relative;z-index:2}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(13,91,215,.4)}
.btn-login:hover::before{opacity:1}
.btn-login:active{transform:translateY(0) scale(.99)}
.btn-login:disabled{cursor:not-allowed}
.btn-login .spinner{
  display:none;width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
.btn-login.loading{pointer-events:none}
.btn-login.loading .btn-txt{display:none}
.btn-login.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-login.success{
  background:linear-gradient(135deg,#0F9D58,#0a7a44);
  box-shadow:0 10px 24px rgba(15,157,88,.4);
}

.demo-details{
  margin-top:20px;border:1px dashed #c4d6ee;
  border-radius:12px;background:#f6f9fe;overflow:hidden;
}
.demo-details summary{
  padding:12px 16px;font-size:12px;font-weight:700;color:var(--navy);
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  user-select:none;
}
.demo-details summary::-webkit-details-marker{display:none}
.demo-details summary::after{
  content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;
  margin-left:auto;font-size:10px;color:var(--blue);
  transition:transform .25s var(--ease);
}
.demo-details[open] summary::after{transform:rotate(180deg)}
.demo-details .demo-box{
  padding:12px 16px 16px;border-top:1px dashed #c4d6ee;
  font-size:11.5px;color:#4a5b75;line-height:1.9;
}
.demo-details code{
  background:#e7effb;padding:2px 7px;border-radius:5px;
  color:#0b4bb0;font-weight:700;font-family:monospace;font-size:11px;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-11px)}
  40%{transform:translateX(11px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(7px)}
}

.login-process{
  position:fixed;inset:0;z-index:5000;
  background:rgba(6,20,45,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;
  padding:20px;opacity:0;
  transition:opacity .35s var(--ease);
}
.login-process.active{display:flex;opacity:1}
.process-card{
  background:#fff;border-radius:24px;padding:42px 38px;
  max-width:440px;width:100%;
  box-shadow:0 40px 100px rgba(0,0,0,.5);
  text-align:center;
  transform:scale(.9) translateY(20px);
  transition:transform .45s var(--ease-out);
}
.login-process.active .process-card{transform:scale(1) translateY(0)}
.process-logo{
  width:76px;height:76px;margin:0 auto 18px;
  animation:logoPulse 2s ease-in-out infinite;
}
.process-logo svg,.process-logo img{width:100%;height:100%;object-fit:contain}
.process-title{
  font-size:18px;font-weight:800;color:var(--navy);
  margin-bottom:6px;letter-spacing:-.2px;
}
.process-sub{
  font-size:13px;color:var(--gray);margin-bottom:26px;line-height:1.6;
}
.process-steps{
  display:flex;flex-direction:column;gap:12px;
  text-align:left;margin-bottom:22px;
}
.pstep{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-radius:12px;
  background:#f6f9fe;border:1px solid var(--border);
  font-size:13.5px;color:#64748b;
  transition:all .45s var(--ease);
  opacity:.55;
}
.pstep.active{
  background:#E1EEFF;border-color:#0D5BD7;
  color:var(--navy);font-weight:700;opacity:1;
  transform:translateX(4px);
  box-shadow:0 6px 18px rgba(13,91,215,.18);
}
.pstep.done{
  background:#DDF6E8;border-color:#0F9D58;
  color:#0a7a44;font-weight:700;opacity:1;
}
.pstep .p-icon{
  width:30px;height:30px;border-radius:9px;
  background:#e6ecf5;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#94a3b8;flex-shrink:0;
  transition:all .35s var(--ease);
}
.pstep.active .p-icon{background:#0D5BD7;color:#fff}
.pstep.done .p-icon{background:#0F9D58;color:#fff}
.pstep .p-check{
  margin-left:auto;color:#0F9D58;opacity:0;
  transition:opacity .3s;font-size:14px;
}
.pstep.done .p-check{opacity:1}
.process-progress{
  height:4px;background:#e6ecf5;border-radius:99px;
  overflow:hidden;margin-top:4px;
}
.process-progress>i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#0D5BD7,#0F9D58);
  border-radius:99px;
  transition:width .55s var(--ease);
  box-shadow:0 0 12px rgba(13,91,215,.55);
}
.process-success{
  display:none;flex-direction:column;align-items:center;padding:6px 0;
}
.process-success.show{display:flex}
.success-icon{
  width:92px;height:92px;border-radius:50%;
  background:linear-gradient(135deg,#0F9D58,#0a7a44);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:44px;margin-bottom:18px;
  box-shadow:0 10px 32px rgba(15,157,88,.45);
  animation:successPop .6s var(--ease-out);
}
@keyframes successPop{
  0%{transform:scale(0) rotate(-180deg)}
  60%{transform:scale(1.15) rotate(0)}
  100%{transform:scale(1) rotate(0)}
}
.process-success .process-title{color:#0F9D58;font-size:22px}
.process-success .process-sub{margin-bottom:0}

/* =========================================================
   DASHBOARD with CURVED SIDEBAR
   ========================================================= */
.dash{display:flex;min-height:100vh}
.sidebar{
  width:264px;
  background:linear-gradient(180deg,#082B68 0%,#041a3d 100%);
  color:#fff;flex-shrink:0;display:flex;flex-direction:column;
  transition:width .35s var(--ease),transform .35s var(--ease);
  position:sticky;top:0;height:100vh;
  overflow-y:auto;overflow-x:hidden;z-index:250;
  --curve-color:#f6f8fc;
  box-shadow:2px 0 24px rgba(0,0,0,.15);
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.sb-brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 18px;
  border-bottom:1px solid rgba(255,255,255,.1);
  flex-shrink:0;
}
.sb-brand .logo-box{
  width:44px;height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.sb-brand .logo-box svg,.sb-brand .logo-box img{

const LOGO = {
  imageData: null,
  autoFilenames: ['image-logo.jpg','image-logo.png','image logo.jpg','image logo.png','logo.jpg','logo.png','logo.svg'],
  async init() {
    const saved = localStorage.getItem(LOGO_KEY);
    if (saved) { this.imageData = saved; return; }
    for (const name of this.autoFilenames) {
      const ok = await this.tryLoad(name);
      if (ok) return;
    }
  },
  tryLoad(path) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          this.imageData = canvas.toDataURL('image/jpeg', 0.92);
          localStorage.setItem(LOGO_KEY, this.imageData);
          resolve(true);
        } catch (e) { resolve(false); }
      };
      img.onerror = () => resolve(false);
      img.src = path;
    });
  },
  set(dataUrl) {
    this.imageData = dataUrl;
    if (dataUrl) localStorage.setItem(LOGO_KEY, dataUrl);
    else localStorage.removeItem(LOGO_KEY);
  },
  html() {
    if (this.imageData) return `<img src="${this.imageData}" alt="Logo KLIK RAPA'I">`;
    return LOGO_SVG;
  }
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const uid = (p = 'id') => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slugInstansi(s){return String(s||'').toUpperCase().replace(/[().,'"\/\\\-]/g,' ').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,'_').replace(/^_+|_+$/g,'');}
function tglID(d){if(!d)return'-';const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});}
function tglShort(d){if(!d)return'-';const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});}
function waktuID(d){const dt=new Date(d);return dt.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function hariID(d){if(!d)return'-';const dt=new Date(d);if(isNaN(dt))return'-';return['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dt.getDay()];}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function initials(n){return String(n||'?').trim().replace(/^(Hj\.|H\.|Dr\.|Drs\.|Ir\.)\s*/i,'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function bytes(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB';}
function relTime(d){const diff=(Date.now()-new Date(d).getTime())/1000;if(diff<60)return'Baru saja';if(diff<3600)return Math.floor(diff/60)+' menit lalu';if(diff<86400)return Math.floor(diff/3600)+' jam lalu';if(diff<604800)return Math.floor(diff/86400)+' hari lalu';return tglShort(d);}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/86400000);}

function toast(msg,type='success',title=null){
  const icons={success:'fa-circle-check',error:'fa-circle-xmark',warn:'fa-triangle-exclamation',info:'fa-circle-info'};
  const titles={success:'Berhasil',error:'Gagal',warn:'Perhatian',info:'Informasi'};
  const el=document.createElement('div');el.className='toast '+type;
  el.innerHTML=`<i class="fa-solid ${icons[type]||icons.info}"></i><div><strong>${esc(title||titles[type])}</strong><span>${esc(msg)}</span></div>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='.3s';el.style.opacity='0';el.style.transform='translateX(40px)';setTimeout(()=>el.remove(),320);},3600);
}

function openModal(title,body,footer='',size=''){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"></div>
    <div class="modal ${size}"><div class="modal-head"><h3>${title}</h3>
      <button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body">${body}</div>
      ${footer?`<div class="modal-foot">${footer}</div>`:''}</div>`;
  root.classList.add('active');
  if(typeof tickCountdowns==='function')tickCountdowns();
}
function closeModal(){$('#modal-root').classList.remove('active');$('#modal-root').innerHTML='';}
function confirmAction(msg,cb,okLabel='Ya, Lanjutkan',danger=true){
  openModal('Konfirmasi',`<div style="display:flex;gap:16px;align-items:flex-start">
    <div style="width:48px;height:48px;border-radius:13px;background:#FFE2E3;color:#E31B23;
      display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">
      <i class="fa-solid fa-triangle-exclamation"></i></div>
    <p style="font-size:14px;color:#41506a;line-height:1.65">${msg}</p></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfmOk">${okLabel}</button>`);
  $('#cfmOk').onclick=()=>{closeModal();cb();};
}

function currentUser(){const id=localStorage.getItem(SESSION_KEY);if(!id)return null;return DB.users.find(u=>u.id===id&&u.active)||null;}
function doLogin(username,password){
  const u=DB.users.find(x=>x.username.toLowerCase()===String(username).trim().toLowerCase());
  if(!u)return{ok:false,msg:'Username tidak ditemukan.'};
  if(!u.active)return{ok:false,msg:'Akun dinonaktifkan.'};
  if(u.password!==password)return{ok:false,msg:'Password salah.'};
  localStorage.setItem(SESSION_KEY,u.id);
  logAct(u,'Login','Berhasil masuk sistem');
  return{ok:true,user:u};
}
function doLogout(){
  confirmAction('Apakah Anda yakin ingin keluar?',()=>{
    const u=currentUser();if(u)logAct(u,'Logout','Keluar sistem');
    localStorage.removeItem(SESSION_KEY);

    location.hash='#/login';
    render();
  },'Ya, Logout');
}
function logAct(user,aksi,detail){

function notify(userId,title,message,type='info',link=''){

}
function notifyRole(role,title,message,type='info',link=''){

function myNotifs(userId){return DB.notifications.filter(n=>n.userId===userId);}

function updateBellCount(){
  const user=currentUser();if(!user)return;
  const unread=unreadCount(user.id);
  const bell=$('.bell');if(!bell)return;
  const existing=bell.querySelector('.dot');
  if(unread>0){
    if(existing)existing.textContent=unread>99?'99+':unread;
    else bell.insertAdjacentHTML('beforeend',`<span class="dot">${unread>99?'99+':unread}</span>`);
  }else if(existing)existing.remove();
}

const PUBLIC_PAGES=['home','profil-perencana','tugas-fungsi','klinik','regulasi','dokumen','pengumuman','berita','testimonial'];
const STATE={mode:null,page:null};
function getRoute(){const h=location.hash.replace(/^#\/?/,'')||'home';return h.split('/')[0]||'home';}
function go(p){location.hash='#/'+p;}

window.addEventListener('hashchange',()=>{
  closeModal();closeGallery();
  render();
});

function render(){
  const page=getRoute();
  const user=currentUser();
  
  let targetMode;
  if(page==='login'){
    if(user){go('dashboard');return;}
    targetMode='login';
  }else if(PUBLIC_PAGES.includes(page)){
    targetMode='public';
  }else{
    if(!user){toast('Silakan login terlebih dahulu.','warn','Akses Ditolak');location.hash='#/login';return;}
    targetMode='dashboard';
  }
  
  if(targetMode!==STATE.mode){
    STATE.mode=targetMode;
    renderShell(targetMode,user,page);
    STATE.page=page;
    return;
  }
  
  swapContent(targetMode,user,page);
  STATE.page=page;
}

function renderShell(mode,user,page){
  const app=$('#app');
  app.dataset.mode=mode;
  
  if(mode==='login'){
    app.innerHTML=viewLogin();
    initLoginAnimations();
    return;
  }
  if(mode==='public'){
    app.innerHTML=`
      ${pubHeader(page)}
      <div id="pageTransition"></div>
      ${pubFooter()}
    `;
    $('#pageTransition').innerHTML=publicContent(page);
    window.scrollTo({top:0,behavior:'instant'});
    initScrollCraft();
    initStickyHeader();
    return;
  }
  app.innerHTML=viewDashboardShell(user,page);
  $('#pageTransition').innerHTML=dashboardContent(user,page);
  afterDashboardRender(user,page);
}

async function swapContent(mode,user,page){
  const el=$('#pageTransition');
  if(!el){renderShell(mode,user,page);return;}
  
  el.classList.add('swapping');
  await new Promise(r=>setTimeout(r,220));
  
  if(mode==='public'){
    el.innerHTML=publicContent(page);
    updatePublicNavActive(page);
    window.scrollTo({top:0,behavior:'instant'});
    initScrollCraft();
  }else{
    el.innerHTML=dashboardContent(user,page);
    updateSidebarActive(page);
    updateTopbarCrumb(user,page);
    window.scrollTo({top:0,behavior:'instant'});
    afterDashboardRender(user,page);
  }
  
  el.classList.remove('swapping');
}

function afterDashboardRender(user,page){
  if(user.role==='admin'&&page==='dashboard')setTimeout(initChartAdmin,50);
  if(user.role==='pic'&&page==='dashboard')setTimeout(initChartPIC,50);
  if(page==='notifikasi')markAllRead(user.id);

}

function initScrollCraft(){
  const els=document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-scale');
  if(!els.length)return;
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
  },{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
  els.forEach(el=>io.observe(el));
}

function filterPlanner(){
  const q=($('#fPlanner')?.value||'').toLowerCase();
  const j=$('#fPlannerJab')?.value||'';
  const b=$('#fPlannerBidang')?.value||'';
  const list=[];
  PERENCANA_DATA.forEach((p,i)=>{
    if((!q||(p.nama+p.jabatan+p.bidang+p.pendidikan).toLowerCase().includes(q))&&(!j||p.jabatan===j)&&(!b||p.bidang===b))list.push({p,i});
  });
  const g=$('#plannerGrid');
  g.innerHTML=list.length?list.map(x=>plannerCard(x.p,x.i)).join(''):`<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-user-slash"></i><h4>Tidak ditemukan</h4></div>`;
  initScrollCraft();
}

let _galleryIdx=0,_galleryList=[];
function openGallery(idx){
  const q=($('#fPlanner')?.value||'').toLowerCase();
  const j=$('#fPlannerJab')?.value||'';
  const b=$('#fPlannerBidang')?.value||'';
  const filtered=[];
  PERENCANA_DATA.forEach((p,i)=>{
    if((!q||(p.nama+p.jabatan+p.bidang+p.pendidikan).toLowerCase().includes(q))&&(!j||p.jabatan===j)&&(!b||p.bidang===b))filtered.push(i);
  });
  _galleryList=filtered.length?filtered:PERENCANA_DATA.map((_,i)=>i);
  const pos=_galleryList.indexOf(idx);
  _galleryIdx=pos>=0?pos:0;
  renderGallery();
}
function renderGallery(){
  const root=$('#gallery-root');
  const realIdx=_galleryList[_galleryIdx];
  const p=PERENCANA_DATA[realIdx];if(!p)return;
  const total=_galleryList.length;
  const fotoHTML=p.foto?`<img src="${p.foto}" alt="${esc(p.nama)}">`:`<div class="init">${initials(p.nama)}</div>`;
  root.innerHTML=`
    <div class="gallery-stage">
      <button class="gallery-close" onclick="closeGallery()"><i class="fa-solid fa-xmark"></i></button>
      ${total>1?`<button class="gallery-nav gallery-prev" onclick="galleryNav(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="gallery-nav gallery-next" onclick="galleryNav(1)"><i class="fa-solid fa-chevron-right"></i></button>`:''}
      <div class="gallery-photo">${fotoHTML}<div class="gallery-counter">${_galleryIdx+1} / ${total}</div></div>
      <div class="gallery-info">
        <h3>${esc(p.nama)}</h3>
        <div class="jab"><i class="fa-solid fa-briefcase"></i> ${esc(p.jabatan)}</div>
        <div class="det"><i class="fa-solid fa-graduation-cap"></i> ${esc(p.pendidikan||'-')}</div>
        <div class="det"><i class="fa-solid fa-sitemap"></i> ${esc(p.bidang||'-')}</div>
        ${p.diklat&&p.diklat!=='-'?`<div class="det"><i class="fa-solid fa-certificate"></i><span>${esc(p.diklat)}</span></div>`:''}
      </div>
      ${total>1?`<div class="gallery-thumbs">
        ${_galleryList.map((idx,k)=>{const pp=PERENCANA_DATA[idx];const thumb=pp.foto?`<img src="${pp.foto}" alt="">`:`<span>${initials(pp.nama)}</span>`;return`<button class="${k===_galleryIdx?'active':''}" onclick="galleryGo(${k})">${thumb}</button>`;}).join('')}
      </div>`:''}
    </div>`;
  root.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeGallery(){const root=$('#gallery-root');root.classList.remove('active');root.innerHTML='';document.body.style.overflow='';}
function galleryNav(dir){const total=_galleryList.length;if(total<2)return;_galleryIdx=(_galleryIdx+dir+total)%total;renderGallery();}
function galleryGo(k){_galleryIdx=k;renderGallery();}
window.openGallery=openGallery;window.closeGallery=closeGallery;window.galleryNav=galleryNav;window.galleryGo=galleryGo;
document.addEventListener('keydown',e=>{
  if(!$('#gallery-root')?.classList.contains('active'))return;
  if(e.key==='Escape')closeGallery();
  if(e.key==='ArrowLeft')galleryNav(-1);
  if(e.key==='ArrowRight')galleryNav(1);
});

  const errEl   = $('#loginErr');
  const btn     = $('#loginBtn');

  errEl.classList.add('hidden');

  if(!userVal || !passVal){
    errEl.querySelector('span').textContent = 'Username dan password wajib diisi.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  setTimeout(()=>{
    const res = doLogin(userVal, passVal);

    if(!res.ok){
      btn.classList.remove('loading');
      btn.disabled = false;
      errEl.querySelector('span').textContent = res.msg;
      errEl.classList.remove('hidden');
      toast(res.msg,'error','Login Gagal');
      const box = $('.login-box');
      box.style.animation = 'shake .5s';
      setTimeout(()=>box.style.animation='',500);
      return;
    }

    runLoginProcess(res.user);
  }, 550);
}

function runLoginProcess(user){
  const btn = $('#loginBtn');
  btn.classList.remove('loading');
  btn.classList.add('success');
  btn.innerHTML = '<span class="btn-txt"><i class="fa-solid fa-check"></i> Berhasil</span>';

  const proc = $('#loginProcess');
  proc.classList.add('active');

  const steps = $$('.pstep', proc);
  const bar   = $('#processBar');
  let i = 0;
  const STEP_DELAY = 600;

  function runStep(){
    if(i >= steps.length){
      setTimeout(showSuccess, 450);
      return;
    }
    const s = steps[i];
    s.classList.add('active');
    bar.style.width = (((i+0.5)/steps.length)*100)+'%';

    setTimeout(()=>{
      s.classList.remove('active');
      s.classList.add('done');
      bar.style.width = (((i+1)/steps.length)*100)+'%';
      i++;
      setTimeout(runStep, 260);
    }, STEP_DELAY);
  }

  setTimeout(runStep, 400);

  function showSuccess(){
    $('#processSteps').style.display = 'none';
    const succ = $('#processSuccess');
    succ.classList.add('show');
    const firstName = (user.nama||'').split(',')[0].split(' ')[0] || 'Pengguna';
    $('#welcomeMsg').textContent = 'Selamat datang, ' + firstName;

    setTimeout(()=>{
      STATE.mode = null;
      go('dashboard');
      render();
    }, 1500);
  }
}

function initLoginAnimations(){
  $$('.login-stat .num').forEach(el=>{
    const target = parseInt(el.dataset.count) || 0;
    const duration = 1400;
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased).toLocaleString('id-ID');
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString('id-ID');
    }
    requestAnimationFrame(tick);
  });
}

      <div class="field"><label>Jabatan <span class="req">*</span></label><input class="input" id="ikmJabatan" value="${esc(r.pemohon.jabatan)}"></div>
      <div class="field" style="grid-column:1/-1"><label>OPD <span class="req">*</span></label><input class="input" id="ikmOPD" value="${esc(r.pemohon.instansi)}"></div>
    </div>

      <h4 style="color:var(--navy);font-size:14px;font-weight:800;margin-bottom:14px">Penilaian Unsur Pelayanan</h4>
      ${IKM_PERTANYAAN.map((q,i)=>`<div style="margin-bottom:18px">
        <div style="font-weight:700;color:var(--navy);font-size:13px;margin-bottom:10px">${i+1}. ${esc(q.t)} <span style="color:var(--red)">*</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${q.opts.map((o,idx)=>`<label style="display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12.5px;transition:.15s">
            <input type="radio" name="${q.id}" value="${idx+1}"><span>${esc(o)}</span></label>`).join('')}
        </div>
      </div>`).join('')}
    </div>
    <div class="field"><label>Saran <span class="req">*</span></label><textarea class="input" id="ikmSaran" placeholder="Saran untuk peningkatan layanan..." required></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn btn-primary" onclick="submitIKM('${requestId}')"><i class="fa-solid fa-paper-plane"></i> Kirim</button>`,'lg');
}
function submitIKM(requestId){
  const u=currentUser();if(!u)return;
  const r=DB.serviceRequests.find(x=>x.id===requestId);if(!r)return;
  const jawaban={};
  for(const q of IKM_PERTANYAAN){
    const sel=document.querySelector(`input[name="${q.id}"]:checked`);
    if(!sel)return toast('Semua pertanyaan wajib dijawab.','error');
    jawaban[q.id]=parseInt(sel.value);
  }
  if(!$('#ikmJK').value)return toast('Jenis kelamin wajib.','error');
  if(!$('#ikmSaran').value.trim())return toast('Saran wajib.','error');
  const nilaiArr=Object.values(jawaban);
  const rata=nilaiArr.reduce((a,b)=>a+b,0)/nilaiArr.length;
  const nilaiIKM=(rata*25).toFixed(2);
  DB.feedbacks.unshift({id:uid('fb'),requestId,userId:u.id,nama:$('#ikmNama').value,usia:$('#ikmUsia').value,jenisKelamin:$('#ikmJK').value,jabatan:$('#ikmJabatan').value,opd:$('#ikmOPD').value,jawaban,saran:$('#ikmSaran').value,nilaiIKM,createdAt:new Date().toISOString()});
  notifyRole('pic','IKM Baru',`Feedback dari ${$('#ikmNama').value} — Nilai: ${nilaiIKM}`,'success');
  logAct(u,'Isi IKM',r.nomor+' — '+nilaiIKM);
  saveDB();
  toast('Terima kasih! Nilai IKM: '+nilaiIKM,'success');
  closeModal();render();
}

function savePassword(){

  const o=$('#pwOld').value,n=$('#pwNew').value,c=$('#pwConfirm').value;

function myAssignments(user){return DB.assignments.filter(a=>a.executorId===user.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}
function pagePelaksana(page,user){
  switch(page){
    case'dashboard':return viewPelaksanaDashboard(user);
    case'tugas-masuk':return viewTugasList(user,'masuk');
    case'tugas-proses':return viewTugasList(user,'proses');
    case'tugas-selesai':return viewTugasList(user,'selesai');

    case'profil':return viewProfilPage(user);
    case'ganti-password':return viewGantiPassword(user);

function tolakTugas(id){
  openModal('Tolak Penugasan',`<div class="field"><label>Alasan <span class="req">*</span></label><textarea class="input" id="tolakAlasan"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-danger" onclick="doTolak('${id}')">Tolak</button>`);
}
function doTolak(id){
  const alasan=$('#tolakAlasan').value.trim();
  if(!alasan)return toast('Alasan wajib.','error');
  const a=DB.assignments.find(x=>x.id===id);if(!a)return;
  const r=DB.serviceRequests.find(x=>x.id===a.requestId);
  a.status='Ditolak';a.alasanTolak=alasan;
  if(r){r.status='Ditolak';r.alasanTolak=alasan;r.riwayat.push({status:'Ditolak',waktu:new Date().toISOString(),oleh:currentUser().nama,ket:alasan});}
  logAct(currentUser(),'Tolak Penugasan',alasan);
  saveDB();closeModal();toast('Ditolak.','warn');render();
}
function prosesTugas(id){
  const a=DB.assignments.find(x=>x.id===id);if(!a)return;
  a.status='Diproses';
  logAct(currentUser(),'Mulai Proses','');
  saveDB();closeModal();toast('Status diperbarui.','success');render();
}
function selesaikanTugas(id){
  const a=DB.assignments.find(x=>x.id===id);if(!a)return;
  const r=DB.serviceRequests.find(x=>x.id===a.requestId);
  a.status='Selesai';
  if(r){r.status='Selesai';r.riwayat.push({status:'Selesai',waktu:new Date().toISOString(),oleh:currentUser().nama,ket:'Pelayanan diselesaikan'});
    notify(r.userId,'Pelayanan Selesai',`Permohonan ${r.nomor} selesai.`,'success');}
  logAct(currentUser(),'Selesaikan Penugasan',r?r.nomor:'');
  saveDB();closeModal();toast('Selesai.','success');render();
}

/* PIC */
function pagePIC(page,user){
  switch(page){
    case'dashboard':return viewPICDashboard(user);
    case'semua-pengajuan':return viewPICRequests('semua');
    case'pengajuan-baru':return viewPICRequests('baru');
    case'pelayanan-offline':return viewPICRequests('offline');
    case'pelayanan-online':return viewPICRequests('online');
    case'penugasan':return viewPICPenugasan();
    case'jadwal':return viewPICJadwal();
    case'notifikasi':return viewNotifikasiPage(user);
    case'profil':return viewProfilPage(user);
    case'ganti-password':return viewGantiPassword(user);
    default:return viewPICDashboard(user);
  }
}

  const reqs=DB.serviceRequests;
  const c=s=>reqs.filter(r=>r.status===s).length;
  return`<div class="mb16"><h2 style="font-size:22px;font-weight:800;color:var(--navy)">Dashboard Operator 👋</h2>
    <p class="muted" style="margin-top:4px">Pusat pengelolaan pelayanan KLIK RAPA'I.</p></div>
  <div class="stats mb24">
    ${statCard('fa-file-lines','navy',reqs.length,'Total')}
    ${statCard('fa-file-circle-plus','yellow',c('Menunggu Verifikasi'),'Pengajuan Baru')}
    ${statCard('fa-spinner','purple',c('Diproses'),'Diproses')}
    ${statCard('fa-flag-checkered','green',c('Selesai'),'Selesai')}
    ${statCard('fa-building','navy',reqs.filter(r=>r.jenis==='offline').length,'Offline')}
    ${statCard('fa-globe','green',reqs.filter(r=>r.jenis==='online').length,'Online')}
  </div>
  <div class="flex gap12 wrap mb24">
    <a href="#/pengajuan-baru" class="btn btn-primary"><i class="fa-solid fa-file-circle-plus"></i> Verifikasi (${c('Menunggu Verifikasi')})</a>
    <a href="#/penugasan" class="btn btn-navy"><i class="fa-solid fa-diagram-project"></i> Penugasan</a>

    <canvas id="chartJenis" height="180"></canvas></div>
    <div class="card"><div class="card-h"><h3><i class="fa-solid fa-chart-column"></i> Status Pelayanan</h3></div>
    <canvas id="chartStatus" height="180"></canvas></div></div>`;

let charts={};
function initChartPIC(){
  if(typeof Chart==='undefined')return;
  ['jenis','status'].forEach(k=>{try{charts[k].destroy();}catch(e){}});
  const reqs=DB.serviceRequests;
  const el1=$('#chartJenis');
  if(el1)charts.jenis=new Chart(el1,{type:'doughnut',data:{labels:['Offline','Online'],datasets:[{data:[reqs.filter(r=>r.jenis==='offline').length,reqs.filter(r=>r.jenis==='online').length],backgroundColor:['#0D5BD7','#0F9D58'],borderWidth:0}]},options:{responsive:true,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
  const el2=$('#chartStatus');
  if(el2){const labels=STATUSES.filter(s=>s!=='Dibatalkan');
    charts.status=new Chart(el2,{type:'bar',data:{labels,datasets:[{label:'Jumlah',data:labels.map(s=>reqs.filter(r=>r.status===s).length),backgroundColor:['#F5B800','#0D5BD7','#6D3BBF','#0F9D58','#E31B23'],borderRadius:7}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});}
}
function viewPICRequests(mode){
  const titles={semua:'Semua Pengajuan',baru:'Pengajuan Baru',offline:'Pelayanan Offline',online:'Pelayanan Online'};
  let list=[...DB.serviceRequests].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(mode==='baru')list=list.filter(r=>r.status==='Menunggu Verifikasi');
  else if(mode==='offline')list=list.filter(r=>r.jenis==='offline');
  else if(mode==='online')list=list.filter(r=>r.jenis==='online');
  return`<div class="card"><div class="card-h"><h3><i class="fa-solid fa-folder-open"></i> ${titles[mode]}</h3></div>
    ${list.length?`<div class="table-wrap"><table class="tbl">
      <thead><tr><th>No</th><th>Nomor</th><th>Pemohon</th><th>Keperluan</th><th>Jenis</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody>${list.map((r,i)=>{
        const a=DB.assignments.find(x=>x.requestId===r.id);
        return`<tr><td>${i+1}</td><td><b style="color:var(--navy);font-size:12.5px">${esc(r.nomor)}</b></td>
          <td>${esc(r.pemohon.nama)}<div class="small muted">${esc(r.pemohon.instansi)}</div></td>
          <td>${esc(r.keperluan)}</td><td>${jenisBadge(r.jenis)}</td><td>${badge(r.status)}</td>
          <td><div class="flex gap8">
            <button class="btn btn-ghost btn-xs" onclick="detailRequest('${r.id}')"><i class="fa-solid fa-eye"></i></button>
            ${r.status==='Menunggu Verifikasi'?`<button class="btn btn-success btn-xs" onclick="verifikasiTerima('${r.id}')"><i class="fa-solid fa-check"></i></button>
              <button class="btn btn-danger btn-xs" onclick="verifikasiTolak('${r.id}')"><i class="fa-solid fa-xmark"></i></button>`:''}
            ${r.status==='Diterima'&&!a?`<button class="btn btn-primary btn-xs" onclick="formPenugasan('${r.id}')"><i class="fa-solid fa-diagram-project"></i></button>`:''}
          </div></td></tr>`;
      }).join('')}</tbody></table></div>`
      :`<div class="empty"><i class="fa-solid fa-inbox"></i><h4>Tidak ada data</h4></div>`}
  </div>`;
}
function verifikasiTerima(id){
  openModal('Verifikasi — Terima',`<div class="field"><label>Catatan</label><textarea class="input" id="vCatatan"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-success" onclick="doVerifikasiTerima('${id}')">Terima</button>`);
}
function doVerifikasiTerima(id){
  const r=DB.serviceRequests.find(x=>x.id===id);if(!r)return;
  r.status='Diterima';r.catatanPic=$('#vCatatan').value.trim();
  r.riwayat.push({status:'Diterima',waktu:new Date().toISOString(),oleh:currentUser().nama,ket:r.catatanPic||'Diverifikasi'});
  notify(r.userId,'Permohonan Diterima',`${r.nomor} diterima.`,'success');
  logAct(currentUser(),'Verifikasi Terima',r.nomor);
  saveDB();closeModal();toast('Diterima.','success');render();
}
function verifikasiTolak(id){

function viewPICPenugasan(){
  const siap=DB.serviceRequests.filter(r=>r.status==='Diterima'&&!DB.assignments.find(a=>a.requestId===r.id));
  return`<div class="card mb24"><div class="card-h"><h3><i class="fa-solid fa-file-circle-plus"></i> Siap Ditugaskan</h3>
    <span class="badge bg-accept">${siap.length}</span></div>
    ${siap.length?`<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Nomor</th><th>Pemohon</th><th>Keperluan</th><th></th></tr></thead>
      <tbody>${siap.map(r=>`<tr><td><b style="color:var(--navy)">${esc(r.nomor)}</b></td>
        <td>${esc(r.pemohon.nama)}</td><td>${esc(r.keperluan)}</td>
        <td><button class="btn btn-primary btn-xs" onclick="formPenugasan('${r.id}')"><i class="fa-solid fa-paper-plane"></i> Tugaskan</button></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty"><i class="fa-solid fa-circle-check"></i><h4>Tidak ada yang menunggu</h4></div>`}

function formPenugasan(requestId){
  const r=DB.serviceRequests.find(x=>x.id===requestId);if(!r)return;
  const perencanaList=DB.users.filter(u=>u.role==='pelaksana'&&u.active);
  openModal('Buat Penugasan',`
    <div style="background:#f6f9fe;padding:14px;border-radius:11px;margin-bottom:18px">
      <div class="small muted">Nomor</div><b style="color:var(--navy)">${esc(r.nomor)}</b>
      <div class="small muted mt8">Pemohon</div><b>${esc(r.pemohon.nama)}</b>
      <div class="small muted mt8">Keperluan</div><b>${esc(r.keperluan)}</b>
    </div>
    <div class="field"><label>Perencana <span class="req">*</span></label>
      <select class="input" id="pgPerencanaId" required><option value="">— Pilih —</option>
        ${perencanaList.map(p=>`<option value="${p.id}">${esc(p.nama)} — ${esc(p.jabatan)}</option>`).join('')}</select></div>
    <div class="field"><label>Deadline <span class="req">*</span></label><input class="input" type="date" id="pgDeadline" min="${todayISO()}" required></div>
    <div class="field"><label>Catatan</label><textarea class="input" id="pgCatatan" placeholder="Instruksi..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="kirimPenugasan('${requestId}')"><i class="fa-solid fa-paper-plane"></i> Kirim</button>`,'lg');
}
function kirimPenugasan(requestId){
  const r=DB.serviceRequests.find(x=>x.id===requestId);if(!r)return;
  const execId=$('#pgPerencanaId').value,deadline=$('#pgDeadline').value;
  if(!execId)return toast('Perencana wajib.','error');
  if(!deadline)return toast('Deadline wajib.','error');
  const u=currentUser();const exec=DB.users.find(x=>x.id===execId);
  DB.assignments.unshift({id:uid('asg'),requestId:r.id,serviceUserId:r.userId,executorId:execId,picId:u.id,perencana:exec.nama,perencanaJabatan:exec.jabatan,catatan:$('#pgCatatan').value.trim(),deadline,status:'Menunggu Respon',createdAt:new Date().toISOString()});
  r.status='Diproses';
  r.riwayat.push({status:'Diproses',waktu:new Date().toISOString(),oleh:u.nama,ket:'Ditugaskan ke '+exec.nama});
  notify(execId,'Penugasan Baru',`${r.nomor} — ${r.keperluan}`,'task');
  notify(r.userId,'Permohonan Diproses',`${r.nomor} ditugaskan ke ${exec.nama}.`,'info');
  logAct(u,'Buat Penugasan',r.nomor+' → '+exec.nama);
  saveDB();closeModal();toast('Dikirim ke '+exec.nama+'.','success');render();
}
function viewPICJadwal(){
  const list=DB.schedules.slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  return`<div class="card"><div class="card-h"><h3><i class="fa-solid fa-calendar-days"></i> Jadwal Layanan Offline</h3>
    <button class="btn btn-primary btn-sm" onclick="formJadwal()"><i class="fa-solid fa-plus"></i> Tambah</button></div>
    ${list.length?`<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Tanggal</th><th>Hari</th><th>Sesi</th><th>Kapasitas</th><th>Aksi</th></tr></thead>
      <tbody>${list.map(s=>`<tr><td>${tglID(s.tanggal)}</td><td>${hariID(s.tanggal)}</td>
        <td>${esc(s.sesi)}</td><td>${s.kapasitas}</td>
        <td><button class="btn btn-ghost btn-xs" onclick="hapusJadwal('${s.id}')"><i class="fa-solid fa-trash" style="color:var(--red)"></i></button></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty"><i class="fa-solid fa-calendar-days"></i><h4>Belum ada jadwal</h4></div>`}
  </div>`;
}
function formJadwal(){
  openModal('Tambah Jadwal',`<div class="grid2">
    <div class="field"><label>Tanggal</label><input class="input" type="date" id="jdTanggal" value="${todayISO()}"></div>
    <div class="field"><label>Sesi</label><select class="input" id="jdSesi"><option>Sesi 1</option><option>Sesi 2</option></select></div></div>
    <div class="field"><label>Kapasitas</label><input class="input" type="number" id="jdKapasitas" value="${APP.kapasitasSesi}"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveJadwal()">Simpan</button>`);
}
function saveJadwal(){
  const t=$('#jdTanggal').value,s=$('#jdSesi').value,k=parseInt($('#jdKapasitas').value)||1;
  if(!t)return toast('Tanggal wajib.','error');
  DB.schedules.push({id:uid('sch'),tanggal:t,sesi:s,kapasitas:k,active:true});
  saveDB();closeModal();toast('Ditambahkan.','success');render();
}
function hapusJadwal(id){confirmAction('Hapus jadwal ini?',()=>{DB.schedules=DB.schedules.filter(s=>s.id!==id);saveDB();toast('Dihapus.','success');render();});}

  else if(tab==='pengumuman')body=`<div class="table-wrap"><table class="tbl"><thead><tr><th>Judul</th><th>Tanggal</th></tr></thead>
    <tbody>${DB.announcements.map(a=>`<tr><td><b style="color:var(--navy)">${esc(a.judul)}</b></td><td>${tglShort(a.tanggal)}</td></tr>`).join('')}</tbody></table></div>`;
  else body=`<div class="table-wrap"><table class="tbl"><thead><tr><th>Nama</th><th>Isi</th><th>Rating</th></tr></thead>
    <tbody>${DB.testimonials.map(t=>`<tr><td><b style="color:var(--navy)">${esc(t.nama)}</b></td><td>${esc(t.isi.substring(0,80))}…</td><td>${t.rating}★</td></tr>`).join('')}</tbody></table></div>`;
  return`<div class="card"><div class="card-h"><h3><i class="fa-solid fa-newspaper"></i> Konten Publik</h3></div>
    <div class="tab-nav">${tabs.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="window._kontenTab='${k}';render()">${t}</button>`).join('')}</div>
    ${body}</div>`;
}
function viewAdminBranding(){
  const logoHTML=LOGO.imageData
    ?`<img src="${LOGO.imageData}" alt="Logo">`
    :LOGO_SVG;
  return`<div class="card" style="max-width:720px"><div class="card-h"><h3><i class="fa-solid fa-image"></i> Logo & Branding</h3></div>
    <div class="alert info"><i class="fa-solid fa-info-circle"></i>
      <div>Upload logo instansi Anda. Logo akan tampil di header, footer, dan sidebar.<br>
      <b>Auto-load:</b> Jika ada file <code>image-logo.jpg</code> atau <code>image-logo.png</code> di folder yang sama dengan file HTML, logo akan otomatis termuat.</div>
    </div>
    <div class="photo-uploader">
      <div class="photo-preview" id="logoPreview" style="width:140px;height:140px">${logoHTML}</div>
      <input type="file" id="logoFile" accept="image/*" class="hidden" onchange="handleLogoUpload(this)">
      <div class="flex gap8 wrap" style="justify-content:center">
        <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('logoFile').click()">
          <i class="fa-solid fa-upload"></i> Pilih Logo</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="resetLogo()">
          <i class="fa-solid fa-rotate-left"></i> Reset ke Default</button>
      </div>
      <div class="small muted" style="text-align:center">Format: JPG/PNG · Maks ${bytes(APP.maxLogoSize)} · Rasio 1:1</div>
    </div>
  </div>`;
}
function handleLogoUpload(input){
  const f=input.files[0];if(!f)return;
  if(!/^image\//i.test(f.type)){toast('File harus berupa gambar.','error');input.value='';return;}
  if(f.size>APP.maxLogoSize){toast(`Maksimal ${bytes(APP.maxLogoSize)}.`,'error');input.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    LOGO.set(e.target.result);
    toast('Logo berhasil diupload.','success');
    STATE.mode=null;
    render();
  };
  reader.readAsDataURL(f);
}
function resetLogo(){
  confirmAction('Reset logo ke default?',()=>{
    LOGO.set(null);
    toast('Logo direset.','success');
    STATE.mode=null;
    render();
  },'Ya, Reset');
}
function viewAdminLog(){
  const list=DB.logs.slice(0,200);
  return`<div class="card"><div class="card-h"><h3><i class="fa-solid fa-clock-rotate-left"></i> Log Aktivitas</h3></div>
    ${list.length?`<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th></tr></thead>
      <tbody>${list.map(l=>`<tr><td class="small">${waktuID(l.waktu)}</td>
        <td><b style="color:var(--navy)">${esc(l.nama)}</b></td>
        <td>${esc(l.aksi)}</td><td class="small muted">${esc(l.detail||'-')}</td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty"><i class="fa-solid fa-clock-rotate-left"></i><h4>Belum ada log</h4></div>`}
  </div>`;
}

function tickCountdowns(){
  document.querySelectorAll('[data-deadline]').forEach(el=>{
    const dl=el.dataset.deadline;if(!dl)return;
    const end=new Date(dl+'T23:59:59').getTime();
    const diff=end-Date.now();const abs=Math.abs(diff);
    const d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000),m=Math.floor((abs%3600000)/60000),s=Math.floor((abs%60000)/1000);
    const timeStr=(d>0?d+'h ':'')+pad(h)+':'+pad(m)+':'+pad(s);
    el.innerHTML=`<i class="fa-solid fa-stopwatch"></i> ${diff<=0?timeStr+' lewat':timeStr}`;
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  const loadLogo=$('#loadLogo');
  if(loadLogo)loadLogo.innerHTML=LOGO_SVG;
  const bar=$('#loadBar'),status=$('#loadStatus');
  const steps=[
    'Memuat logo…',
    'Menginisialisasi database…',
    'Menyiapkan 23 akun OPD…',
    'Memuat data perencana…',
    'Siap digunakan'
  ];
  for(let i=0;i<steps.length;i++){
    if(bar)bar.style.width=((i+1)/steps.length*100)+'%';
    if(status)status.textContent=steps[i];
    await new Promise(r=>setTimeout(r,180));
  }
  await LOGO.init();
  loadDB();
  render();
  startClock();
  setInterval(tickCountdowns,1000);
  tickCountdowns();
  const ls=$('#loadingScreen');
  if(ls){ls.classList.add('hide');setTimeout(()=>ls.remove(),700);}
  window.addEventListener('resize',()=>{
    if(window.innerWidth>900){$('#sidebar')?.classList.remove('open');$('#sbOverlay')?.classList.remove('active');}
  });
  document.addEventListener('click',e=>{
    const dd=$('#notifDD');
    if(dd&&dd.innerHTML.trim()&&!e.target.closest('.bell')&&!e.target.closest('.notif-dropdown'))dd.innerHTML='';
  });
}
init();
</script>
